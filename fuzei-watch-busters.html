<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>風情ウォッチバスターズ</title>
<link rel="preload" href="fonts/LightNovelPOPv2.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root { --navy: #14245a; --yel: #ffd21f; --black-bg: #2a2b31; --blue-bg: #a9dcff; --title-bg: linear-gradient(135deg, #55D5F5 0%, #29B6E9 50%, #0068C8 100%); }
/* フォント：ラノベPOP v2（fonts/ に同梱。M+ FONTS のライセンス。説明は fonts/LightNovelPOPv2-ReadMe.html） */
@font-face { font-family: 'FWB'; src: url('fonts/LightNovelPOPv2.woff2') format('woff2'); font-display: block; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--title-bg); color: #fff; font-family: 'FWB', sans-serif; user-select: none; }
.screen { position: fixed; inset: 0; display: none; }
.screen.on { display: flex; }

/* 文字：ロゴに合わせた太字＋紺のふち（光の表現はなし） */
.lt { font-size: clamp(22px, 3.6vw, 40px); color: var(--yel); -webkit-text-stroke: .12em var(--navy); paint-order: stroke fill; letter-spacing: .02em; }
.lt.blue { color: #2f8cff; }
.lt.white { color: #fff; }

/* 団をえらぶ（最初の画面） */
#select { flex-direction: row; }
.team { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; cursor: pointer; }
.team.kuroneko { background: var(--black-bg); }
.team.shimainu { background: var(--blue-bg); }
.team img { width: min(40vw, 480px); max-height: 60vh; object-fit: contain; transition: transform .15s; }
.team.cur img { transform: scale(1.06); }
.team .lt { visibility: hidden; }
.team.cur .lt { visibility: visible; }
#select .head { position: fixed; top: 4vh; left: 0; right: 0; text-align: center; pointer-events: none; }

/* タイトル */
#title { background: var(--title-bg); flex-direction: column; align-items: center; justify-content: center; gap: 3vh; }
/* ロゴとボタンをたてにならべて、画面のまんなかに */
#tWrap { position: relative; display: flex; justify-content: center; pointer-events: none; }
#title img { width: min(88vw, 780px); max-height: 58vh; object-fit: contain; }
#tWrap, .menu { position: relative; z-index: 2; }
/* ---- タイトルの背景：街のシルエット（横に流れる） ---- */
#bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
#bg svg { position: absolute; display: block; }
.city { left: 0; bottom: 0; width: 200%; height: 34vh; animation: scroll linear infinite; }
.city.far { height: 52vh; opacity: .22; animation-duration: 140s; }
.city.near { animation-duration: 70s; }
@keyframes scroll { to { transform: translateX(-50%); } }
/* はじめから・つづきから：ふだんは紫、カーソルを合わせると黄色 */
.menu { display: flex; flex-direction: column; align-items: center; gap: 12px; visibility: hidden; }
.menu.on { visibility: visible; }
.mbtn { position: relative; width: min(56vw, 250px); padding: .42em 0 .38em; transition: transform .12s cubic-bezier(.3, 1.6, .5, 1); border: 3px solid #0b0b0b; border-radius: 15px; font: inherit; font-size: clamp(22px, 2.8vw, 31px); color: #111; cursor: pointer;
  background: #c393fd; box-shadow: inset 0 0 0 3px #fff, inset 0 0 8px 6px rgba(255, 255, 255, .7), 0 4px 0 #002a3e; -webkit-text-stroke: .14em #fff; paint-order: stroke fill; }
.mbtn::after { content: ''; position: absolute; left: 8px; right: 8px; top: 6px; height: 42%; border-radius: 9px 9px 5px 5px; background: linear-gradient(rgba(255, 255, 255, .75), rgba(255, 255, 255, .2)); pointer-events: none; }
.mbtn.cur { background: #ffd72c; transform: scale(1.1); }
.mbtn:disabled { cursor: default; filter: grayscale(1); opacity: .6; }
.mbtn:active:not(:disabled) { transform: scale(1.1) translateY(3px); box-shadow: inset 0 0 0 3px #fff, inset 0 0 8px 6px rgba(255, 255, 255, .7), 0 1px 0 #002a3e; }
#note { position: fixed; left: 0; right: 0; top: 3vh; text-align: center; font-size: 18px; color: #fff; -webkit-text-stroke: .2em #0b0b0b; paint-order: stroke fill; visibility: hidden; }
#note.on { visibility: visible; }

/* ---- にっきせんたく（セーブデータをえらぶ） ---- */
.dscr { flex-direction: column; align-items: center; background: #8b52e6 repeating-linear-gradient(0deg, rgba(255, 255, 255, .06) 0 2px, transparent 2px 6px); color: #111; }
.dscr .dhead { position: absolute; left: 0; top: 0; height: clamp(46px, 10.5vh, 92px); width: min(56vw, 760px); display: flex; align-items: center; padding-left: clamp(18px, 4vw, 64px);
  background: linear-gradient(90deg, #ffe31a 0 58%, rgba(255, 227, 26, 0) 100%); }
.dscr .dhead canvas { position: absolute; left: 34%; top: 0; height: 100%; width: 66%; }
.dscr .dhead b { position: relative; z-index: 1; font-weight: normal; font-size: clamp(24px, 4vw, 50px); color: #23206b; letter-spacing: .02em; }
.slots { margin-top: clamp(60px, 15vh, 150px); width: min(70vw, 1130px); display: flex; flex-direction: column; gap: 2.2vh; }
.slot { position: relative; display: flex; align-items: center; height: clamp(62px, 15.5vh, 140px); border: 4px solid #0b0b0b; border-radius: 18px; cursor: pointer;
  background: linear-gradient(#ecdcff 0%, #d4b6fd 35%, #c9a6fb 100%); box-shadow: inset 0 0 0 3px #fff, inset 0 0 10px 6px rgba(255, 255, 255, .55), 0 4px 0 rgba(30, 0, 70, .55); transition: transform .1s; }
.slot.cur { background: linear-gradient(#fff38a 0%, #ffe94a 35%, #ffd900 100%); transform: scale(1.015); }
.slot .lab { width: 26%; display: flex; align-items: baseline; justify-content: center; gap: .3em; border-right: 3px solid rgba(120, 70, 190, .35); height: 62%; align-items: center; }
.slot.cur .lab { border-right-color: rgba(170, 130, 0, .35); }
.slot .lab span { font-size: clamp(16px, 2.6vw, 40px); -webkit-text-stroke: .14em #fff; paint-order: stroke fill; }
.slot .lab i { font-style: italic; font-size: clamp(30px, 5.2vw, 78px); line-height: 1; transform: skewX(-6deg); -webkit-text-stroke: .1em #fff; paint-order: stroke fill; }
.slot .body { position: relative; flex: 1; height: 100%; display: flex; align-items: center; padding: 0 4% 0 5%; font-family: 'FWB', sans-serif; font-weight: normal; font-size: clamp(16px, 2.7vw, 42px); color: #2b2440; }
.slot .body .nm { flex: 1; }
.slot .body .tm { display: flex; align-items: center; gap: .6em; font-family: 'FWB', sans-serif; font-weight: normal; font-size: .9em; letter-spacing: .08em; position: absolute; right: 4%; top: 14%; }
.slot .body .tm svg { width: 1em; height: 1em; }
.slot .body .bar { position: absolute; left: 5%; right: 5%; bottom: 17%; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .55); overflow: hidden; }
.slot .body .bar i { display: block; height: 100%; background: #1673e6; border-radius: 4px; }
.slot .body.has .nm { align-self: center; margin-top: -2.2%; }
.dhelp { margin-top: 3.6vh; width: min(66vw, 1090px); height: clamp(46px, 10.5vh, 100px); border-radius: 60px; background: #5a2fa8; display: flex; align-items: center; color: #fff; font-family: 'FWB', sans-serif; font-weight: normal; font-size: clamp(15px, 2.4vw, 38px); }
.dhelp .q { flex: none; width: 1.7em; height: 1.7em; margin: 0 7% 0 7%; border-radius: 50%; background: #ffe31a; color: #111; display: flex; align-items: center; justify-content: center; font-family: 'FWB', sans-serif; font-weight: normal; }
.dhelp rt { font-size: .45em; }
.dbtn { position: absolute; bottom: 3.5vh; height: clamp(46px, 11vh, 104px); width: min(18vw, 300px); border: 4px solid #0b0b0b; border-radius: 16px; font: inherit; font-size: clamp(18px, 3vw, 44px); color: #111; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .3em;
  -webkit-text-stroke: .12em #fff; paint-order: stroke fill; box-shadow: inset 0 0 0 3px #fff, inset 0 0 10px 6px rgba(255, 255, 255, .55), 0 4px 0 rgba(30, 0, 70, .55); transition: transform .12s cubic-bezier(.3, 1.6, .5, 1); }
.dbtn.back { left: 7%; background: linear-gradient(#efe3ff, #d2b4fd); }
.dbtn.go { right: 7%; background: linear-gradient(#ffd75a, #ffa21c); }
.dbtn:hover, .dbtn.cur { transform: scale(1.08); }
.dbtn.back:hover, .dbtn.back.cur { background: linear-gradient(#fff38a, #ffd900); }
.dbtn.go.off { filter: grayscale(.8); opacity: .6; cursor: default; transform: none; }
.dbtn svg { height: .95em; width: 1.3em; }

/* ---- なまえをきめる（はじめから → にっき をえらんだあと） ---- */
.nmbox { margin-top: clamp(80px, 22vh, 210px); width: min(70vw, 1130px); }
.nmrow { display: flex; align-items: center; height: clamp(70px, 17vh, 150px); border: 4px solid #0b0b0b; border-radius: 18px;
  background: linear-gradient(#fff38a 0%, #ffe94a 35%, #ffd900 100%); box-shadow: inset 0 0 0 3px #fff, inset 0 0 10px 6px rgba(255, 255, 255, .55), 0 4px 0 rgba(30, 0, 70, .55); }
.nmrow .lab { width: 26%; height: 62%; display: flex; align-items: center; justify-content: center; border-right: 3px solid rgba(170, 130, 0, .35); font-size: clamp(16px, 2.6vw, 40px); -webkit-text-stroke: .14em #fff; paint-order: stroke fill; color: #111; }
.nmrow .fld { position: relative; flex: 1; height: 100%; display: flex; align-items: center; padding: 0 5%; }
.nmrow input { width: 100%; border: 0; outline: 0; background: transparent; font: inherit; font-size: clamp(20px, 3.4vw, 52px); color: #2b2440; caret-color: #1673e6; }
.nmrow input::placeholder { color: rgba(43, 36, 64, .35); }
.nmrow .bar { position: absolute; left: 5%; right: 5%; bottom: 18%; height: 7px; border-radius: 4px; background: #1673e6; }
.nmrow .cnt { position: absolute; right: 5%; top: 12%; font-size: clamp(12px, 1.6vw, 22px); color: rgba(43, 36, 64, .6); }
.nmteam { margin-top: 2.6vh; display: flex; align-items: center; justify-content: center; gap: 1em; font-size: clamp(14px, 2vw, 26px); color: #fff; -webkit-text-stroke: .18em #3a1a7a; paint-order: stroke fill; }
.nmteam img { height: clamp(40px, 8vh, 80px); }

/* 上から落ちてきて、まんなかで跳ねる */
.drop { transform-origin: 50% 100%; animation: drop 1.6s both; }
@keyframes drop {
  0%   { transform: translateY(-130vh); animation-timing-function: cubic-bezier(.5, 0, 1, .5); }
  42%  { transform: translateY(0) scale(1.15, .82); animation-timing-function: cubic-bezier(.2, .7, .4, 1); }
  57%  { transform: translateY(-13vh) scale(.96, 1.05); animation-timing-function: cubic-bezier(.6, 0, .8, .4); }
  69%  { transform: translateY(0) scale(1.08, .9); animation-timing-function: cubic-bezier(.2, .7, .4, 1); }
  78%  { transform: translateY(-4.5vh) scale(.99, 1.02); animation-timing-function: cubic-bezier(.6, 0, .8, .4); }
  86%  { transform: translateY(0) scale(1.03, .97); animation-timing-function: ease-out; }
  100% { transform: translateY(0) scale(1, 1); }
}

/* デバッグ */
#dbg { position: fixed; right: 8px; top: 8px; z-index: 9; padding: 6px 8px; border-radius: 8px; background: rgba(0, 0, 0, .6); font: 12px system-ui, sans-serif; }
#dbg select { font: inherit; margin: 2px; padding: 2px 4px; border: 1px solid #888; border-radius: 5px; background: #333; color: #fff; cursor: pointer; }
/* キャラを動かすデバッグ（debug-kuroneko.html をそのまま中に出す） */
#play { background: #000; }
#play iframe { width: 100%; height: 100%; border: 0; display: block; }
body.playing #dbg { top: auto; bottom: 8px; right: auto; left: 8px; }
#dbg button { font: inherit; margin: 2px; padding: 2px 8px; border: 1px solid #888; border-radius: 5px; background: #333; color: #fff; cursor: pointer; }
@media (max-width: 720px) {
  #select { flex-direction: column; }
  .team img { width: min(78vw, 400px); max-height: 32vh; }
}
</style>
</head>
<body>
<div id="select" class="screen on">
  <div class="team kuroneko" data-team="kuroneko"><img src="img/fwb-logo-kuroneko.png" alt="黒猫団"><span class="lt white">黒猫団にする</span></div>
  <div class="team shimainu" data-team="shimainu"><img src="img/fwb-logo-shimainu.png" alt="島犬隊"><span class="lt blue">島犬隊にする</span></div>
  <div class="head"><span class="lt">どっちの団に入る？</span></div>
</div>

<div id="title" class="screen">
  <div id="bg"></div>
  <div id="tWrap"><img id="tLogo" alt="風情ウォッチバスターズ"></div>
  <div class="menu" id="menu"><button class="mbtn" data-m="new">はじめから</button><button class="mbtn" data-m="cont">つづきから</button></div>
  <div id="note">この先は作っているところです</div>
</div>

<div id="diary" class="screen dscr">
  <div class="dhead"><canvas id="dDots"></canvas><b>にっきせんたく</b></div>
  <div class="slots" id="slots"></div>
  <div class="dhelp"><span class="q">?</span><span id="dHelp"></span></div>
  <button class="dbtn back" id="dBack"><svg viewBox="0 0 40 30"><path d="M14 4 L3 14 L14 24 L14 18 L24 18 Q30 18 30 12 Q30 7 24 7 L18 7" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M14 4 L3 14 L14 24 L14 18 L24 18 Q30 18 30 12 Q30 7 24 7 L18 7" fill="none" stroke="#9b6cf0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></svg>もどる</button>
  <button class="dbtn go" id="dGo">けってい</button>
</div>

<div id="naming" class="screen dscr">
  <div class="dhead"><canvas id="nDots"></canvas><b>なまえをきめる</b></div>
  <div class="nmbox">
    <div class="nmrow"><div class="lab">なまえ</div><div class="fld"><input id="nmIn" maxlength="8" placeholder="なまえを入れてね" autocomplete="off" spellcheck="false"><span class="cnt" id="nmCnt">0/8</span><span class="bar"></span></div></div>
    <div class="nmteam" id="nmTeam"></div>
  </div>
  <div class="dhelp"><span class="q">?</span><span id="nHelp"></span></div>
  <button class="dbtn back" id="nBack"><svg viewBox="0 0 40 30"><path d="M14 4 L3 14 L14 24 L14 18 L24 18 Q30 18 30 12 Q30 7 24 7 L18 7" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M14 4 L3 14 L14 24 L14 18 L24 18 Q30 18 30 12 Q30 7 24 7 L18 7" fill="none" stroke="#9b6cf0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></svg>もどる</button>
  <button class="dbtn go" id="nGo">けってい</button>
</div>

<div id="play" class="screen"><iframe id="playFrame" title="キャラを動かす"></iframe></div>

<div id="dbg">デバッグ
  <select id="dJump" title="画面へとぶ">
    <option value="">画面へとぶ…</option>
    <option value="select">団えらび</option>
    <option value="title">タイトル</option>
    <option value="diary-new">にっきせんたく（はじめから）</option>
    <option value="diary-cont">にっきせんたく（つづきから）</option>
    <option value="naming">なまえをきめる</option>
    <option value="play">キャラを動かす</option>
    <option value="hq">本部（3D）</option>
  </select>
  <button data-d="drop">落下もう一回</button><button data-d="wipe">にっきを全部消す</button></div>

<script>
// 風情ウォッチバスターズ（作り直し版・デバッグ）：団をえらぶ → タイトル
const $ = (id) => document.getElementById(id);
const TEAMS = { kuroneko: { name: '黒猫団', logo: 'img/fwb-logo-kuroneko.png' }, shimainu: { name: '島犬隊', logo: 'img/fwb-logo-shimainu.png' } };
const SAVE_KEY = 'fwb2.team';
const store = (v) => { try { localStorage.setItem(SAVE_KEY, v); } catch (e) { } };
const saved = (() => { try { return localStorage.getItem(SAVE_KEY); } catch (e) { return null; } })();

// 音：えらぶ・決定は前の版の効果音、着地の「ドン」は合成
const AC = window.AudioContext ? new AudioContext() : null, buf = {};
const loadSe = async (n, u) => { if (!AC) return; try { buf[n] = await AC.decodeAudioData(await (await fetch(u)).arrayBuffer()); } catch (e) { } };
function se(n, v = .6) { if (!AC || !buf[n]) return; const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = buf[n]; g.gain.value = v; s.connect(g).connect(AC.destination); s.start(); }
function thud(p = 1) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + .25);
  g.gain.setValueAtTime(.8 * p, t); g.gain.exponentialRampToValueAtTime(.001, t + .3);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .32);
}
[['move', 'se/fwb-move.mp3'], ['ok', 'se/fwb-ok.mp3'], ['back', 'se/fwb-back.mp3'], ['title', 'bgm/fwb-title.mp3']].forEach(([n, u]) => loadSe(n, u));
// タイトルの BGM：頭の無音は削ってある。おしりの静かなところ（87.08 秒〜）は飛ばして、すきまなくくり返す
const BGM_LOOP_END = 87.08;
let bgmSrc = null;
function playBgm() {
  if (!AC || bgmSrc) return;
  if (!buf.title) { setTimeout(playBgm, 200); return; }   // まだ読みこみ中
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = buf.title; s.loop = true; s.loopStart = 0; s.loopEnd = Math.min(BGM_LOOP_END, buf.title.duration); g.gain.value = .5;
  s.connect(g).connect(AC.destination); s.start(); bgmSrc = s;
}
// ブラウザはクリックかキーを押すまで音を出せないので、最初の操作で BGM を鳴らしはじめる（どの画面でも）
function unlockAudio() { if (AC && AC.state === 'suspended') AC.resume(); playBgm(); }
addEventListener('pointerdown', unlockAudio);

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  document.body.classList.toggle('playing', id === 'play');
  // キャラを動かす画面をはなれたら、中の 3D を止める（読みこみなおしは次に開いたとき）
  const f = $('playFrame'); if (f && id !== 'play' && f.getAttribute('src')) f.removeAttribute('src');
  const j = $('dJump'); if (j) j.value = '';
}

// ---- 団をえらぶ ----
let cur = saved && TEAMS[saved] ? saved : 'kuroneko', timers = [];
const teams = [...document.querySelectorAll('.team')];
// マウスを合わせた団だけ光らせる（はじめは どちらも ふつう）
let hov = null;
function setCur(t, sound = true) { if (t && t !== hov && sound) se('move', .5); hov = t; teams.forEach(e => e.classList.toggle('cur', e.dataset.team === t)); }
function pick(t) {
  if (AC && AC.state === 'suspended') AC.resume();
  se('ok', .7); store(t); cur = t;
  playBgm();
  startTitle();
}
teams.forEach(e => {
  e.addEventListener('mouseenter', () => { if ($('select').classList.contains('on')) setCur(e.dataset.team); });
  e.addEventListener('mouseleave', () => setCur(null));
  e.addEventListener('click', () => { if ($('select').classList.contains('on')) pick(e.dataset.team); });
});
function goSelect() { timers.forEach(clearTimeout); timers = []; show('select'); setCur(null); }

// ---- タイトル：えらんだ団のロゴが落ちてきて跳ねる ----
let ready = false;
function startTitle() {
  timers.forEach(clearTimeout); timers = []; ready = false;
  show('title');
  const img = $('tLogo'), menu = $('menu');
  img.src = TEAMS[cur].logo; menu.classList.remove('on'); $('note').classList.remove('on');
  img.classList.remove('drop'); void img.offsetWidth; img.classList.add('drop');
  timers.push(setTimeout(() => thud(1), 1600 * .42), setTimeout(() => thud(.4), 1600 * .69), setTimeout(() => thud(.15), 1600 * .86));
  timers.push(setTimeout(() => { $('cont').disabled = !hasSave(); setM(-1); menu.classList.add('on'); ready = true; }, 1600));
}
// はじめから・つづきから（セーブがないときは、つづきからは押せない）
// にっき（セーブデータ）は3つ。localStorage の fwb2.diary に [ {name, team, time(秒), story(0〜1), at} | null ] ×3
const DIARY_KEY = 'fwb2.diary';
function loadDiary() { try { const d = JSON.parse(localStorage.getItem(DIARY_KEY)); if (Array.isArray(d)) return [0, 1, 2].map(i => d[i] || null); } catch (e) { } return [null, null, null]; }
function saveDiary(d) { try { localStorage.setItem(DIARY_KEY, JSON.stringify(d)); } catch (e) { } }
const hasSave = () => loadDiary().some(Boolean);
const mbtns = [...document.querySelectorAll('.mbtn')]; mbtns[1].id = 'cont';
// マウスを合わせたボタンだけ黄色＆大きく（はじめは どちらも紫。-1 は どれも合わせていない）
let mi = -1;
function setM(i, sound) {
  if (i >= 0 && i !== mi && sound) se('move', .5);
  mi = i; mbtns.forEach((b, k) => b.classList.toggle('cur', k === i));
}
function choose(i) {
  if (!ready || mbtns[i].disabled) return;
  se('ok', .7);
  openDiary(mbtns[i].dataset.m);
}
mbtns.forEach((b, i) => { b.addEventListener('mouseenter', () => { if (ready && !b.disabled) setM(i, true); }); b.addEventListener('mouseleave', () => setM(-1)); b.addEventListener('click', () => choose(i)); });

// ---- にっきせんたく ----
//  つづきから：データのあるにっきだけえらべる。はじめから：空のにっきは「さいしょから はじめる」（データのあるにっきは上書きの確認つき）
//  ここからはキーボードでも動かせる（↑↓ えらぶ・Enter / Space けってい・Esc / Backspace もどる）
const DM = { mode: 'cont', sel: 0, d: [], confirm: -1, done: false };
const fmtTime = (sec) => { const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60; return `${h}:${String(m).padStart(2, '0')}`; };
const CLOCK = '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#fff" stroke="#111" stroke-width="2.6"/><path d="M10 5 V10 H14" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"/></svg>';
function openDiary(mode) {
  DM.mode = mode; DM.d = loadDiary(); DM.confirm = -1; DM.done = false;
  const first = DM.d.findIndex(x => mode === 'cont' ? !!x : !x);
  DM.sel = first < 0 ? 0 : first;
  show('diary'); drawDots(); renderDiary();
}
function slotText(i) {
  const x = DM.d[i];
  if (x) return `<div class="body has"><span class="nm">${esc(x.name)}</span><span class="tm">${CLOCK}${fmtTime(x.time || 0)}</span><span class="bar"><i style="width:${Math.round((x.story || 0) * 100)}%"></i></span></div>`;
  return `<div class="body"><span class="nm">${DM.mode === 'new' ? 'さいしょから　はじめる' : 'データがありません'}</span></div>`;
}
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function renderDiary() {
  $('slots').innerHTML = DM.d.map((x, i) => `<div class="slot${i === DM.sel ? ' cur' : ''}" data-i="${i}"><div class="lab"><span>にっき</span><i>${i + 1}</i></div>${slotText(i)}</div>`).join('');
  $('slots').querySelectorAll('.slot').forEach(el => {
    const i = +el.dataset.i;
    el.addEventListener('mouseenter', () => selSlot(i, true));
    el.addEventListener('click', () => { selSlot(i, false); decide(); });
  });
  updateHelp();
}
function selSlot(i, sound) {
  if (DM.done || i === DM.sel) return;
  if (sound) se('move', .5);
  DM.sel = i; DM.confirm = -1;
  $('slots').querySelectorAll('.slot').forEach((el, k) => el.classList.toggle('cur', k === i));
  updateHelp();
}
const RB = (k, r) => `<ruby>${k}<rt>${r}</rt></ruby>`;
function canGo() { const x = DM.d[DM.sel]; return DM.mode === 'new' || !!x; }
function updateHelp(msg) {
  const x = DM.d[DM.sel];
  let h;
  if (msg) h = msg;
  else if (DM.mode === 'cont') h = x ? `${RB('物語', 'ものがたり')}のつづきを${RB('遊', 'あそ')}びます` : 'このにっきには データがありません';
  else if (DM.confirm === DM.sel) h = 'もう一度 けっていで、このにっきを消して はじめます';
  else h = x ? 'このにっきを消して、さいしょから はじめます' : `${RB('新', 'あたら')}しく${RB('物語', 'ものがたり')}をはじめます`;
  $('dHelp').innerHTML = h;
  $('dGo').classList.toggle('off', !canGo());
}
function decide() {
  if (DM.done) return;
  if (!canGo()) { se('back', .4); return; }
  const i = DM.sel, x = DM.d[i];
  if (DM.mode === 'new' && x && DM.confirm !== i) { se('move', .6); DM.confirm = i; updateHelp(); return; }   // 上書きは2回押しで
  se('ok', .7);
  if (DM.mode === 'new') { openNaming(i); return; }      // はじめから：つぎは なまえをきめる
  DM.done = true;
  updateHelp(`にっき ${i + 1} で はじめます（この先は作っているところです）`);
}
function diaryBack() { se('back', .6); startTitle(); }
$('dGo').addEventListener('click', decide);
$('dBack').addEventListener('click', diaryBack);
addEventListener('keydown', (e) => {
  if ($('naming').classList.contains('on')) return namingKey(e);
  if (!$('diary').classList.contains('on')) return;     // キーボードは にっきせんたく から
  const k = e.key;
  if (k === 'ArrowUp' || k === 'w') { e.preventDefault(); selSlot((DM.sel + 2) % 3, true); }
  else if (k === 'ArrowDown' || k === 's') { e.preventDefault(); selSlot((DM.sel + 1) % 3, true); }
  else if (k === 'Enter' || k === ' ') { e.preventDefault(); decide(); }
  else if (k === 'Escape' || k === 'Backspace') { e.preventDefault(); diaryBack(); }
});
// ---- なまえをきめる ----
//  はじめから → にっき をえらぶ → ここ。8文字まで（ひらがな・カタカナ・漢字・英数字なんでも）。からっぽでは けってい できない
//  Enter けってい・Esc もどる（文字を入れているとちゅう＝変換中の Enter / Esc は 変換のほうに使う）
const NM = { slot: 0, done: false };
const NAME_MAX = 8;
const nmText = () => $('nmIn').value.trim();
function openNaming(slot) {
  NM.slot = slot; NM.done = false;
  show('naming'); drawDots('nDots');
  const T = TEAMS[cur];
  $('nmTeam').innerHTML = `<img src="${T.logo}" alt="">${T.name}の あたらしい たいいん`;
  $('nmIn').value = ''; $('nmIn').disabled = false;
  nmUpdate();
  setTimeout(() => $('nmIn').focus(), 50);
}
function nmUpdate(msg) {
  const n = [...$('nmIn').value].length;
  $('nmCnt').textContent = `${n}/${NAME_MAX}`;
  $('nGo').classList.toggle('off', !nmText() || NM.done);
  $('nHelp').innerHTML = msg || (nmText() ? `この${RB('名前', 'なまえ')}で はじめます` : `あなたの${RB('名前', 'なまえ')}を 入れてください`);
}
function nmDecide() {
  if (NM.done) return;
  const name = nmText();
  if (!name) { se('back', .4); $('nmIn').focus(); return; }
  se('ok', .7);
  DM.d[NM.slot] = { name, team: cur, time: 0, story: 0, at: Date.now() }; saveDiary(DM.d);
  NM.done = true; $('nmIn').disabled = true;
  nmUpdate(`「${esc(name)}」で にっき ${NM.slot + 1} を はじめます（この先は作っているところです）`);
}
function nmBack() { se('back', .6); openDiary('new'); DM.sel = NM.slot; renderDiary(); }
function namingKey(e) {
  if (e.isComposing || e.keyCode === 229) return;          // 変換中
  if (e.key === 'Enter') { e.preventDefault(); nmDecide(); }
  else if (e.key === 'Escape') { e.preventDefault(); nmBack(); }
}
$('nmIn').addEventListener('input', () => {
  const a = [...$('nmIn').value]; if (a.length > NAME_MAX) $('nmIn').value = a.slice(0, NAME_MAX).join('');   // 絵文字なども 1 文字に数える
  nmUpdate();
});
$('nGo').addEventListener('click', nmDecide);
$('nBack').addEventListener('click', nmBack);
// 見出しの右の、だんだん小さくなる黄色いひし形
function drawDots(id = 'dDots') {
  const c = $(id), r = c.getBoundingClientRect(), W = c.width = Math.round(r.width), H = c.height = Math.round(r.height), g = c.getContext('2d');
  g.clearRect(0, 0, W, H); g.fillStyle = '#ffe31a';
  const st = H / 3.6;
  for (let x = 0; x < W; x += st) for (let y = 0; y < H; y += st) {
    const k = 1 - x / W, s = st * .42 * Math.max(.25, k) * (0.8 + .2 * Math.sin(x * .7 + y * 1.3));
    if (s < 1 || Math.random() > k + .25) continue;
    const cx = x + ((y / st) % 2) * st / 2, cy = y + st / 2;
    g.beginPath(); g.moveTo(cx, cy - s); g.lineTo(cx + s, cy); g.lineTo(cx, cy + s); g.lineTo(cx - s, cy); g.fill();
  }
}

// 団えらび・タイトルの操作はマウスだけ（キーボードでは動かさない）
document.querySelectorAll('#dbg button').forEach(b => b.addEventListener('click', (e) => {
  e.stopPropagation();
  if (b.dataset.d === 'drop') startTitle(); else if (b.dataset.d === 'wipe') { saveDiary([null, null, null]); if ($('diary').classList.contains('on')) openDiary(DM.mode); }
}));
// ---- デバッグ：ドロップダウンから各画面へとぶ ----
function openPlay(src = 'debug-kuroneko.html') {
  timers.forEach(clearTimeout); timers = [];
  show('play');
  const f = $('playFrame'); f.src = src;
  f.onload = () => { try { f.contentWindow.focus(); } catch (e) { } };   // そのままキーボードで動かせるように
}
function jumpTo(v) {
  if (!v) return;
  timers.forEach(clearTimeout); timers = [];
  if (v === 'select') goSelect();
  else if (v === 'title') startTitle();
  else if (v === 'diary-new') openDiary('new');
  else if (v === 'diary-cont') openDiary('cont');
  else if (v === 'naming') { DM.d = loadDiary(); openNaming(Math.max(0, DM.d.findIndex(x => !x))); }
  else if (v === 'play') openPlay();
  else if (v === 'hq') openPlay('debug-hq.html');
}
$('dJump').addEventListener('change', (e) => { jumpTo(e.target.value); e.target.blur(); });
$('dJump').addEventListener('pointerdown', (e) => e.stopPropagation());
setCur(null);
// ---- タイトルの背景を組み立てる ----
(() => {
  const NS = 'http://www.w3.org/2000/svg', bg = $('bg');
  const svg = (cls, vb, html, style = '') => { const e = document.createElementNS(NS, 'svg'); e.setAttribute('class', cls); e.setAttribute('viewBox', vb); e.setAttribute('preserveAspectRatio', 'none'); e.setAttribute('style', style); e.innerHTML = html; bg.appendChild(e); return e; };
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // 街：ビルを並べたシルエット（同じ並びを2回つなげて、横にずっと流れる）
  const city = (h, col, win) => {
    let x = 0, out = '';
    const one = [];
    while (x < 1000) { const w = 30 + rnd() * 60, bh = h * (.35 + rnd() * .6); one.push([x, w, bh]); x += w + rnd() * 6; }
    for (const off of [0, 1000]) for (const [bx, w, bh] of one) {
      out += `<rect x="${bx + off}" y="${100 - bh}" width="${w}" height="${bh}" fill="${col}"/>`;
      if (win) for (let wy = 100 - bh + 5; wy < 96; wy += 9) for (let wx = bx + 5; wx < bx + w - 8; wx += 11) if (rnd() < .55) out += `<rect x="${wx + off}" y="${wy}" width="5" height="4" fill="${win}"/>`;
    }
    return out;
  };
  svg('city far', '0 0 2000 100', city(95, '#0b4fa8'));
  svg('city near', '0 0 2000 100', city(70, '#1a68cc', '#3f8fe6'));
})();
window.__fwb = { startTitle, goSelect, pick };
</script>
