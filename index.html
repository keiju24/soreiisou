<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>それ、言いそう！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<!-- 通信ライブラリ（PeerJS / WebRTC）。ホストのブラウザがゲームサーバー役になります -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--ink:#2B2D42;--y:#FFD23F;--y2:#FFC21A;--pink:#FF5D8F;--cyan:#2EC4B6;--blue:#4D96FF;--purple:#9B5DE5;--orange:#FF8C42;--green:#6BCB77;--paper:#FFFDF5;--red:#FF3B3B;--gold:#FFC300}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'M PLUS Rounded 1c',system-ui,-apple-system,"Hiragino Maru Gothic ProN",sans-serif;color:var(--ink);background:var(--y);overflow-x:hidden;font-weight:800}
#bg{position:fixed;top:50%;left:50%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;background:repeating-conic-gradient(var(--y) 0 9deg,var(--y2) 9deg 18deg);animation:spin 90s linear infinite;z-index:-2}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 3px,transparent 4px);background-size:34px 34px;z-index:-1;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
header#top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px;max-width:900px;margin:0 auto}
.mini-logo{font-family:'Dela Gothic One',sans-serif;font-size:18px;color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink);white-space:nowrap}
#roomBadge{font-size:14px;background:var(--ink);color:#fff;border-radius:999px;padding:4px 12px;letter-spacing:2px}
#roomBadge:empty{display:none}
.snd{display:flex;gap:6px}
.snd button{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:18px;box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:0}
.snd button.off{background:#bbb;filter:grayscale(1);opacity:.7}
main#app{max-width:780px;margin:0 auto;padding:4px 14px 70px}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);padding:22px;margin:16px 0}
.hidden{display:none!important}
.center{text-align:center}
.logo{font-family:'Dela Gothic One',sans-serif;text-align:center;font-size:clamp(44px,12vw,86px);line-height:1.08;margin:4px 0;font-weight:400}
.logo.small{font-size:clamp(34px,9vw,60px)}
.logo span{display:inline-block;color:var(--pink);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);animation:wobble 1.6s ease-in-out infinite}
.logo span:nth-child(2){color:var(--cyan);animation-delay:-.8s}
@keyframes wobble{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.06)}}
.tagline{text-align:center;font-size:18px;margin:6px 0 18px}
.lbl{display:block;font-size:15px;margin:10px 0 6px}
input,textarea,select{font-family:inherit;font-weight:800;font-size:20px;border:4px solid var(--ink);border-radius:16px;padding:12px 14px;width:100%;background:#fff;color:var(--ink);outline:none}
textarea{resize:none;line-height:1.5}
input:focus,textarea:focus{box-shadow:0 0 0 5px rgba(255,93,143,.45)}
.btn{font-family:inherit;font-weight:800;font-size:18px;border:4px solid var(--ink);border-radius:999px;padding:12px 22px;background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;position:relative}
.btn:hover:not(:disabled){transform:translateY(-2px) rotate(-1.5deg)}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pink{background:var(--pink);color:#fff}.btn.cyan{background:var(--cyan);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.purple{background:var(--purple);color:#fff}.btn.orange{background:var(--orange);color:#fff}
.btn.big{font-size:24px;padding:16px 28px;width:100%}
.btn.small{font-size:14px;padding:8px 14px;box-shadow:0 4px 0 var(--ink)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn.pulse:not(:disabled){animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.home-actions{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.or{text-align:center;font-size:14px;opacity:.7}
.join-row{display:flex;gap:10px}
.join-row input{text-transform:uppercase;letter-spacing:6px;text-align:center;font-family:'Dela Gothic One',sans-serif}
.join-row .btn{flex:0 0 auto}
.err{background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;margin-top:14px;animation:shakeX .5s}
.foot-links{display:flex;justify-content:center;margin-top:18px}
.room-label{text-align:center;font-size:16px}
.room-code{font-family:'Dela Gothic One',sans-serif;text-align:center;font-size:clamp(56px,16vw,96px);letter-spacing:10px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);line-height:1.1}
.h2{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:24px;margin:20px 0 10px}
.plist{display:flex;flex-wrap:wrap;gap:10px}
.pchip{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 14px 6px 6px;box-shadow:0 4px 0 var(--ink);animation:chipIn .5s cubic-bezier(.2,1.8,.4,1) both}
.pchip.off{opacity:.4}
.pchip .you{font-size:11px;background:var(--pink);color:#fff;border-radius:999px;padding:1px 7px}
.pchip.done{background:var(--green);color:#fff}
@keyframes chipIn{0%{transform:scale(0) rotate(-20deg)}100%{transform:none}}
.av{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--c,#ccc);border:3px solid var(--ink);font-size:22px;flex:0 0 auto;line-height:1}
.av.sm{width:28px;height:28px;font-size:15px;border-width:2px;margin-right:2px}
.av.huge{width:150px;height:150px;font-size:90px;border-width:6px;box-shadow:8px 8px 0 var(--ink)}
.lobby-ctl{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.setting-row{display:flex;align-items:center;gap:10px;font-size:16px}
.setting-row select{width:auto;font-size:16px;padding:6px 10px}
.wait-msg{text-align:center;font-size:18px;padding:14px;border:3px dashed var(--ink);border-radius:16px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.hint{font-size:14px;opacity:.75;text-align:center}
/* intro */
.intro{text-align:center;padding-top:20px;position:relative}
.round-badge{display:inline-block;font-family:'Dela Gothic One',sans-serif;background:var(--ink);color:var(--y);border-radius:999px;padding:6px 20px;font-size:20px;animation:bigPop .5s both}
.intro-sub{font-family:'Dela Gothic One',sans-serif;font-size:clamp(28px,8vw,48px);margin:26px 0 10px;animation:shiver .12s linear infinite}
@keyframes shiver{0%{transform:translate(1px,0)}50%{transform:translate(-1px,1px)}100%{transform:translate(0,-1px)}}
.intro-target{display:flex;flex-direction:column;align-items:center;gap:14px;animation:bigPop .8s cubic-bezier(.2,1.8,.4,1) 1.95s both}
.intro-name{font-family:'Dela Gothic One',sans-serif;font-size:clamp(44px,13vw,80px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink)}
.itsyou{font-size:26px;background:var(--pink);color:#fff;border:4px solid var(--ink);border-radius:999px;padding:6px 22px;animation:wobble .6s infinite}
.spot{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,transparent 0 180px,rgba(43,45,66,.55) 260px);pointer-events:none;z-index:-1;animation:fadeIn .4s both}
@keyframes bigPop{0%{opacity:0;transform:scale(.2) rotate(-15deg)}100%{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}
/* answer */
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.who{display:flex;align-items:center;gap:8px;font-size:18px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 16px 4px 4px;box-shadow:0 4px 0 var(--ink)}
.timer{--p:1;position:relative;width:74px;height:74px;border-radius:50%;border:4px solid var(--ink);background:conic-gradient(var(--cyan) calc(var(--p)*360deg),#fff 0);display:grid;place-items:center;flex:0 0 auto;box-shadow:0 4px 0 var(--ink)}
.timer b{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:22px}
.timer.hurry{background:conic-gradient(var(--red) calc(var(--p)*360deg),#fff 0);animation:shakeX .4s infinite}
.timer.small{width:56px;height:56px}.timer.small b{width:38px;height:38px;font-size:16px}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-3deg)}75%{transform:translateX(4px) rotate(3deg)}}
.bubble{position:relative;background:#fff;border:4px solid var(--ink);border-radius:28px;padding:22px 20px;margin:20px 0 24px;font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:clamp(22px,5.6vw,32px);line-height:1.4;text-align:center;box-shadow:8px 8px 0 var(--ink);animation:bigPop .6s cubic-bezier(.2,1.6,.4,1) both}
.bubble::after{content:"";position:absolute;left:50%;bottom:-26px;margin-left:-14px;border:14px solid transparent;border-top:14px solid var(--ink)}
.bubble.small{font-size:clamp(17px,4.4vw,22px);padding:14px 16px;margin:12px 0 18px}
.hl{color:var(--pink);-webkit-text-stroke:1px var(--ink)}
.role-msg{font-size:19px;margin-bottom:12px}
.cnt{text-align:right;font-size:14px;opacity:.7;margin:4px 4px 12px}
.done-msg{text-align:center;font-size:22px;padding:18px;animation:bigPop .5s both}
.done-msg .mine-ans{display:block;font-size:17px;opacity:.75;margin-top:8px}
.progress{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
/* cards */
.phase-title{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:clamp(22px,6vw,34px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);line-height:1.3}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin:18px 0}
.card{position:relative;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:18px 16px;font-size:20px;line-height:1.5;box-shadow:6px 6px 0 var(--ink);transform:rotate(var(--r,0deg));text-align:left;font-family:inherit;font-weight:800;color:var(--ink);word-break:break-word;width:100%}
.card.reveal{animation:dropIn .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes dropIn{0%{opacity:0;transform:translateY(-140px) rotate(-35deg) scale(.3)}100%{opacity:1;transform:rotate(var(--r,0deg))}}
.card .qmark{position:absolute;top:-16px;right:-12px;width:38px;height:38px;border-radius:50%;background:var(--pink);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-family:'Dela Gothic One',sans-serif;font-size:20px}
.card.votable{cursor:pointer;transition:transform .15s,background .15s}
.card.votable:hover:not(:disabled){transform:rotate(0) scale(1.04);background:#FFF3B0}
.card.votable:disabled{cursor:default}
.card.mine{background:#e9e9e9;opacity:.7}
.cards.locked .card:not(.chosen){opacity:.45}
.card.chosen{background:var(--pink)!important;color:#fff;transform:scale(1.06) rotate(0);animation:chosen .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes chosen{0%{transform:scale(.8)}100%{transform:scale(1.06)}}
.tag{display:inline-block;font-size:12px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 10px;margin-bottom:6px}
/* result */
.res .ctext{margin:4px 0 10px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.badge{font-size:14px;border:3px solid var(--ink);border-radius:999px;padding:3px 10px;background:#fff}
.badge.gold{background:var(--gold)}.badge.pink{background:var(--pink);color:#fff}.badge.cyan{background:var(--cyan);color:#fff}.badge.purple{background:var(--purple);color:#fff}
.owner{display:flex;align-items:center;gap:6px;font-size:16px;border-top:3px dashed var(--ink);padding-top:10px}
.voters{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:13px;margin-top:8px;min-height:4px}
.stage-real,.stage-owner,.stage-pick,.stage-score{opacity:0;transform:scale(.3);transition:opacity .35s,transform .5s cubic-bezier(.2,1.8,.4,1)}
#resWrap.show-real .stage-real,#resWrap.show-owner .stage-owner,#resWrap.show-pick .stage-pick,#resWrap.show-score .stage-score{opacity:1;transform:none}
#resWrap.show-real .real-card{background:var(--gold);transform:scale(1.07) rotate(0);z-index:2;transition:transform .5s cubic-bezier(.2,1.8,.4,1),background .3s;box-shadow:0 0 0 6px #fff,10px 10px 0 var(--ink)}
.res-head{text-align:center;margin-top:10px}
.mydelta{text-align:center;font-family:'Dela Gothic One',sans-serif;font-size:clamp(34px,10vw,54px);color:var(--pink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);margin:10px 0}
.mydelta.zero{color:#aaa}
.srow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:3px dashed rgba(43,45,66,.25);flex-wrap:wrap}
.srow.me{background:#FFF3B0;border-radius:14px}
.srow .rank{font-family:'Dela Gothic One',sans-serif;width:30px;text-align:center;font-size:20px}
.srow .sname{font-size:18px}
.srow .sname{flex:1 1 auto}
.srow .reasons{order:9;flex-basis:100%;padding-left:92px;font-size:12px;opacity:.7;margin-top:-6px}
.srow .reasons:empty{display:none}
.srow .delta{color:var(--pink);font-size:18px}
.srow .delta.zero{color:#aaa}
.srow .score{font-family:'Dela Gothic One',sans-serif;font-size:24px;min-width:46px;text-align:right}
.ctl{display:flex;flex-direction:column;gap:12px;margin-top:16px}
/* final */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:26px 0 0;min-height:300px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;width:31%;max-width:180px;transform:translateY(130%);opacity:0;transition:transform .8s cubic-bezier(.2,1.5,.4,1),opacity .3s}
.pod.up{transform:none;opacity:1}
.pod .pname{font-size:17px;text-align:center;word-break:break-all}
.pod .block{width:100%;border:4px solid var(--ink);border-bottom:none;border-radius:16px 16px 0 0;display:grid;place-items:center;font-family:'Dela Gothic One',sans-serif;font-size:40px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.pod.p1 .block{height:170px;background:var(--gold)}.pod.p2 .block{height:120px;background:#C9D1D9}.pod.p3 .block{height:85px;background:#E0A370}
.pod .pscore{font-size:16px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 12px}
.pod.p1 .av{width:76px;height:76px;font-size:44px}
.pod .crown{font-size:44px;animation:wobble 1s infinite}
.award{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:3px dashed rgba(43,45,66,.25)}
.award .em{font-size:38px}
.award .at{font-size:19px}
.award .ad{font-size:13px;opacity:.7}
.award .an{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;font-size:15px;align-items:center}
/* overlays */
#overlay{position:fixed;inset:0;background:rgba(43,45,66,.6);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
#overlay.show{display:flex}
#overlay .panel{max-width:560px;width:100%;max-height:88vh;overflow:auto;animation:bigPop .4s cubic-bezier(.2,1.6,.4,1) both}
.spinner{font-size:60px;text-align:center;animation:spin 1s linear infinite}
.rules h3{font-family:'Dela Gothic One',sans-serif;font-weight:400;margin:16px 0 6px}
.rules ol,.rules ul{padding-left:22px;line-height:1.7;font-weight:500}
.rules table{border-collapse:collapse;width:100%;font-weight:500}
.rules td{border-bottom:2px dashed #ccc;padding:6px}
.rules td:last-child{text-align:right;font-weight:800;color:var(--pink);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 22px;z-index:80;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .2s;max-width:90vw;text-align:center;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
body.shake main{animation:shakeBig .5s}
@keyframes shakeBig{0%,100%{transform:none}20%{transform:translate(-10px,4px) rotate(-1deg)}40%{transform:translate(10px,-4px) rotate(1deg)}60%{transform:translate(-6px,2px)}80%{transform:translate(6px,-2px)}}
/* アイコン */
.av.img{background-size:cover;background-position:center;font-size:0}
.icon-row{display:flex;align-items:center;gap:12px}
.icon-row .av{width:64px;height:64px;font-size:36px}
.picker-prev{display:flex;justify-content:center;margin:6px 0 14px}
.picker-prev .av{width:110px;height:110px;font-size:64px;border-width:5px;box-shadow:6px 6px 0 var(--ink)}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:10px 0 16px}
.emoji-grid button{font-size:28px;height:52px;border:3px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0}
.emoji-grid button.sel{background:var(--pink);transform:scale(1.1)}
.upload-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
#abortBtn{background:var(--red);color:#fff;font-size:13px;padding:6px 12px;white-space:nowrap}
/* ===== パチンコ大当たり演出 ===== */
#fever{position:fixed;inset:0;z-index:65;pointer-events:none;display:none;place-items:center;padding:12px}
#fever.show{display:grid}
#fever.dark{background:radial-gradient(circle,rgba(60,0,90,.65),rgba(0,0,0,.9))}
.ftext{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:clamp(64px,19vw,160px);line-height:1.05;text-align:center;color:transparent;-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:3px #fff;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 28px rgba(255,255,0,.9));animation:feverIn .6s cubic-bezier(.2,1.8,.4,1) both,rainbowSlide .6s linear infinite}
.ftext.rainbow{background-image:linear-gradient(90deg,#ff0040,#ff9900,#ffee00,#33ff66,#00e5ff,#3366ff,#cc33ff,#ff0040);background-size:200% 100%}
.ftext.red{background-image:linear-gradient(180deg,#fff 0%,#ffe600 30%,#ff2a00 65%,#9a0000 100%);background-size:100% 100%;filter:drop-shadow(0 0 12px #ff0) drop-shadow(0 0 32px #f00);animation:feverIn .5s cubic-bezier(.2,1.8,.4,1) both,shiver .08s linear infinite}
.ftext.small{font-size:clamp(40px,12vw,90px)}
.ftext.mid{font-size:clamp(46px,13vw,110px)}
@keyframes rainbowSlide{to{background-position:200% 0}}
@keyframes feverIn{0%{transform:scale(4) rotate(-12deg);opacity:0}60%{transform:scale(.9) rotate(2deg);opacity:1}100%{transform:none;opacity:1}}
#flash{position:fixed;inset:0;background:#fff;z-index:66;pointer-events:none;opacity:0}
#flash.go{animation:flashA .7s ease-out}
@keyframes flashA{0%,20%{opacity:1}100%{opacity:0}}
body.fever #bg{background:repeating-conic-gradient(#ff0040 0 12deg,#ff9900 12deg 24deg,#ffee00 24deg 36deg,#33ff66 36deg 48deg,#00e5ff 48deg 60deg,#3366ff 60deg 72deg,#cc33ff 72deg 84deg);animation:spin 2.2s linear infinite,hue 1s linear infinite}
body.fever::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:64;background:linear-gradient(120deg,rgba(255,0,0,.35),rgba(255,255,0,.35),rgba(0,255,0,.35),rgba(0,255,255,.35),rgba(0,0,255,.35),rgba(255,0,255,.35),rgba(255,0,0,.35));background-size:300% 300%;mix-blend-mode:screen;animation:strobe .14s steps(2) infinite,rainbowSlide 1s linear infinite}
body.fever .mini-logo,body.fever .phase-title,body.fever .logo span{animation:hue .5s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes strobe{50%{opacity:.1}}

  let ctx = null, master, bgmGain, sfxGain, noiseBuf;

  }

    if (!ctx) return;
    const now = at ?? (ctx.currentTime + t);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, now);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), now + d);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(v, now + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.connect(g); g.connect(dest || sfxGain);
    if (vib) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = vib.rate; lg.gain.value = vib.depth; l.connect(lg); lg.connect(o.frequency); l.start(now); l.stop(now + d + 0.05); }
    o.start(now); o.stop(now + d + 0.05);
  }
  function noise({ t = 0, at, d = 0.2, v = 0.3, filter = 'bandpass', freq = 1000, freq2, q = 1, dest }) {

    const fl = ctx.createBiquadFilter(); fl.type = filter; fl.frequency.setValueAtTime(freq, now); fl.Q.value = q;

    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(v, now + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    src.connect(fl); fl.connect(g); g.connect(dest || sfxGain);
    src.start(now, Math.random() * 0.5); src.stop(now + d + 0.05);
  }
  const FX = {

  const R = (a, n) => Array.from({ length: n }, () => a).flat();
  const SONGS = {

const Confetti = (() => {
  const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], raf = null, W = 0, H = 0;
  const cols = ['#FF5D8F', '#2EC4B6', '#4D96FF', '#9B5DE5', '#FF8C42', '#6BCB77', '#FFD23F', '#fff'];
  function resize() { const r = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * r; cv.height = H * r; cx.setTransform(r, 0, 0, r, 0, 0); }
  addEventListener('resize', resize); resize();
  function add(x, y, vx, vy) { parts.push({ x, y, vx, vy, s: 6 + Math.random() * 9, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: cols[(Math.random() * cols.length) | 0], sh: Math.random() < .3 ? 1 : 0 }); }
  function burst(n = 120, px = .5, py = .35) { for (let i = 0; i < n; i++) add(px * W, py * H, (Math.random() - .5) * 18, -Math.random() * 16 - 4); go(); }
  function rain(n = 150) { for (let i = 0; i < n; i++) add(Math.random() * W, -20 - Math.random() * H * .8, (Math.random() - .5) * 3, Math.random() * 3); go(); }
  function go() { if (!raf) raf = requestAnimationFrame(tick); }
  function tick() {
    cx.clearRect(0, 0, W, H);
    for (const p of parts) { p.vy += .32; p.vx *= .99; p.vy = Math.min(p.vy, 7); p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
      if (p.sh) { cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, 7); cx.fill(); } else cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      cx.restore(); }
    parts = parts.filter(p => p.y < H + 30);
    raf = parts.length ? requestAnimationFrame(tick) : null;
    if (!raf) cx.clearRect(0, 0, W, H);
  }
  return { burst, rain };
})();

  finish() { const s = this.s; clearTimeout(this.timer); s.phase = 'final'; s.deadline = 0; this.broadcast(); },
  again() {
    const s = this.s; clearTimeout(this.timer);
    s.players = s.players.filter(p => p.connected); s.players.forEach(p => { p.score = 0; p.stats = newStats(); });
    for (const id in this.imgs) if (!this.player(id)) delete this.imgs[id];
    s.phase = 'lobby'; s.order = []; s.round = 0; s.deadline = 0; s.answers = {}; s.votes = {}; s.cards = []; s.pick = null; s.result = null;
    this.broadcast();

};

/* ===================== 通信 ===================== */
const Net = { peer: null, hostConn: null, joinTimer: null };
function peerOk() {
  if (typeof window.Peer !== 'function') { hideOverlay(); renderHome('通信ライブラリ（PeerJS）を読み込めませんでした。インターネット接続を確認してね。'); return false; }
  return true;
}
function leaveNet() {
  clearTimeout(Net.joinTimer); clearTimeout(Host.timer);
  const p = Net.peer; Net.peer = null; Net.hostConn = null;
  try { p && p.destroy(); } catch {}
  me.isHost = false; Host.s = null; view = null; roomCode = ''; avatarImgs = {}; updateRoomBadge(); $('#abortBtn').classList.add('hidden'); Fever.reset();
}
function createRoom() {
  if (!peerOk()) return;
  showOverlay('<div class="spinner">🎲</div><p class="center">部屋をつくっています…</p>');
  const code = genCode();
  const peer = new window.Peer(CONFIG.PEER_PREFIX + code, CONFIG.PEER_OPTIONS); Net.peer = peer;
  peer.on('open', () => {
    if (Net.peer !== peer) return;
    me.isHost = true; roomCode = code; setTtsDefault(true); updateRoomBadge(); ss.del('room');
    Host.init(); Host.addPlayer(me.pid, me.name, me.avatar); Host.setImg(me.pid, me.img); Host.sendImgs(); hideOverlay(); Host.broadcast();
  });
  peer.on('connection', conn => {
    conn.on('data', d => Host.onMessage(conn, d));
    conn.on('close', () => Host.onClose(conn));
    conn.on('error', () => Host.onClose(conn));
  });
  peer.on('disconnected', () => { if (Net.peer === peer) try { peer.reconnect(); } catch {} });
  peer.on('error', e => {
    if (Net.peer !== peer) return;
    if (e.type === 'unavailable-id') { Net.peer = null; try { peer.destroy(); } catch {} createRoom(); return; }
    if (!roomCode) { leaveNet(); hideOverlay(); renderHome('部屋をつくれませんでした（' + e.type + '）。もう一度ためしてね。'); }
    else toast('通信エラー: ' + e.type);
  });
}
function joinRoom(code) {
  if (!peerOk()) return;
  showOverlay('<div class="spinner">🚪</div><p class="center">部屋「' + esc(code) + '」に入っています…</p>');
  const peer = new window.Peer(CONFIG.PEER_OPTIONS); Net.peer = peer; let got = false;
  const fail = msg => { if (Net.peer !== peer) return; leaveNet(); hideOverlay(); ss.del('room'); renderHome(msg); };
  Net.joinTimer = setTimeout(() => { if (!got) fail('つながりませんでした。部屋コードやネット接続を確認してね。'); }, 15000);
  peer.on('open', () => {
    if (Net.peer !== peer) return;
    const conn = peer.connect(CONFIG.PEER_PREFIX + code, { reliable: true }); Net.hostConn = conn;
    conn.on('open', () => conn.send({ t: 'join', pid: me.pid, name: me.name, avatar: me.avatar, img: me.img }));
    conn.on('data', d => {
      if (Net.hostConn !== conn) return;
      if (d && d.t === 'state' && !got) { got = true; clearTimeout(Net.joinTimer); roomCode = code; setTtsDefault(false); updateRoomBadge(); hideOverlay(); ss.set('room', code); }
      onHostMsg(d);
    });
    conn.on('close', () => { if (Net.hostConn === conn) { const m = lastError || 'ホストとの接続が切れました。'; lastError = ''; fail(m); } });
  });
  peer.on('disconnected', () => { if (Net.peer === peer) try { peer.reconnect(); } catch {} });
  peer.on('error', e => {
    if (Net.peer !== peer) return;
    if (e.type === 'peer-unavailable') fail('部屋「' + code + '」が見つかりません。');
    else if (!got) fail('つながりませんでした（' + e.type + '）');
  });
}
function onHostMsg(d) {
  if (!d || typeof d !== 'object') return;
  if (d.t === 'state') onState(d.v);
  else if (d.t === 'fx') Sound.sfx(d.n);
  else if (d.t === 'imgs') { avatarImgs = (d.m && typeof d.m === 'object') ? d.m : {}; if (view && view.phase === 'lobby' && $('#plist')) updateLobby(); }
  else if (d.t === 'notice') showNotice(d.msg);
  else if (d.t === 'error') lastError = d.msg;
}
function send(a) {
  if (me.isHost) Host.onAction(me.pid, a);
  else if (Net.hostConn && Net.hostConn.open) Net.hostConn.send(a);
  else toast('接続が切れています…');
}
function exitToTop() { ss.del('room'); leaveNet(); stopSpeak(); renderHome(); }

function loadImageFile(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
      const x = c.getContext('2d'), m = Math.min(im.width, im.height);
      x.fillStyle = '#fff'; x.fillRect(0, 0, S, S);
      x.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, S, S);
      URL.revokeObjectURL(url);
      let q = 0.82, d = c.toDataURL('image/jpeg', q);
      while (d.length > 40000 && q > 0.3) { q -= 0.15; d = c.toDataURL('image/jpeg', q); }
      isValidImg(d) ? res(d) : rej(new Error('too big'));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('load')); };
    im.src = url;
  });
}

  <div class="cards" id="cards">${view.cards.map(c => { const mine = c.cid === view.myCid;
    return `<button class="card votable ${mine ? 'mine' : ''}" data-cid="${esc(c.cid)}" ${mine ? 'disabled' : ''} style="--r:${rot(c.cid)}deg">${mine ? `<span class="tag">${isT ? 'あなたの本音' : 'あなたの回答'}</span><br>` : ''}${esc(c.text)}</button>`; }).join('')}</div>
  <div class="center hint" id="voteMsg">${isT ? '自分以外の回答から「言いそう大賞」を1つ選んでね（+3点をあげられる！）' : 'タップして投票！自分の回答には投票できません'}</div>
  <div class="progress" id="progress"></div>`;
  $('#cards').onclick = e => {
    const b = e.target.closest('.card.votable'); if (!b || b.disabled) return;
    if (view.myVote || myVoteLocal) return;
    myVoteLocal = b.dataset.cid; send({ t: 'vote', cid: myVoteLocal }); Sound.sfx('pinpon'); Confetti.burst(30, .5, .5);
    markVote(myVoteLocal);
  };
  updateVote();
}
function markVote(cid) {
  const cards = $('#cards'); if (!cards) return;
  cards.classList.add('locked');
  cards.querySelectorAll('.card').forEach(c => { c.disabled = true; c.classList.toggle('chosen', c.dataset.cid === cid); });
  $('#voteMsg').textContent = '✅ 投票完了！みんなを待ってるよ…';
}
function updateVote() {
  const v = view.myVote || myVoteLocal; if (v) markVote(v);
  const ps = view.players.filter(p => view.order.includes(p.id));
  $('#progress').innerHTML = ps.map(p => { const done = p.id === view.target ? view.picked : view.voted.includes(p.id); return chip(p, done ? 'done' : ''); }).join('');
}

// ---------- 結果 ----------
function buildResult() {
  const r = view.result, t = P(view.target), isLast = view.round + 1 >= view.total;
  const myD = (r.deltas[me.pid] || { total: 0 }).total;
  const cardsHtml = view.cards.map(c => {
    const ownerId = r.owners[c.cid], owner = P(ownerId), isReal = c.cid === r.real, voters = r.votesBy[c.cid] || [];
    const fooled = !isReal && voters.length > 0, isPick = c.cid === r.pick, sync = r.syncs.includes(ownerId);
    return `<div class="card res ${isReal ? 'real-card' : ''} ${isPick ? 'pick-card' : ''}" style="--r:${rot(c.cid)}deg">
      <div class="badges">${isReal ? '<span class="badge gold stage-real">👑 本物！</span>' : ''}${isPick ? '<span class="badge pink stage-pick">🏆 言いそう大賞</span>' : ''}${fooled ? `<span class="badge cyan stage-owner">🎭 だまし成功×${voters.length}</span>` : ''}${sync ? '<span class="badge purple stage-owner">🌀 シンクロ！</span>' : ''}</div>
      <div class="ctext">${esc(c.text)}</div>
      <div class="owner ${isReal ? 'stage-real' : 'stage-owner'}">✍️ ${avatarHtml(owner, 'sm')} ${esc(owner.name)}</div>
      <div class="voters stage-owner">${voters.length ? '🗳️ ' + voters.map(v => avatarHtml(P(v), 'sm')).join('') : ''}</div>
    </div>`; }).join('');
  const rows = view.players.filter(p => view.order.includes(p.id)).sort((a, b) => b.score - a.score).map((p, i) => {
    const d = r.deltas[p.id] || { total: 0, items: [] };
    return `<div class="srow ${p.id === me.pid ? 'me' : ''}"><span class="rank">${i + 1}</span>${avatarHtml(p)}<span class="sname">${esc(p.name)}</span>
      <span class="reasons">${d.items.map(it => `${esc(it.label)}${it.n > 1 ? '×' + it.n : ''} +${it.pts}`).join(' / ')}</span>
      <span class="delta ${d.total ? '' : 'zero'}">+${d.total}</span><span class="score">${p.score}</span></div>`; }).join('');
  app.innerHTML = `
  <div id="resWrap">
    <div class="res-head"><div class="phase-title">🎊 結果はっぴょう！</div></div>
    <div class="bubble small">${topicHtml(view.topic, t.name)}</div>
    <div class="cards">${cardsHtml}</div>
    <div class="stage-score">
      <div class="mydelta ${myD ? '' : 'zero'}">あなた +${myD}</div>
      <div class="panel"><h2 class="h2" style="margin-top:0">📊 スコア（ROUND ${view.round + 1}/${view.total}）</h2>${rows}</div>
    </div>
    <div class="ctl">
      ${me.isHost ? `<button class="btn pink big" id="nextBtn">${isLast ? '🏁 最終結果へ！' : '▶ 次のラウンドへ'}</button>` : '<div class="wait-msg">ホストが次へ進むのを待っています…</div>'}
      <div class="center hint" style="display:flex;align-items:center;justify-content:center;gap:8px">自動で次へ ${timerHtml('small')}</div>
    </div>
  </div>`;
  if (me.isHost) $('#nextBtn').onclick = () => send({ t: 'next' });
  const W = $('#resWrap');
  const anyFooled = Object.keys(r.votesBy).some(cid => cid !== r.real && r.votesBy[cid].length);
  // パチンコ大当たり演出：リーチ → 激アツ → キュイン！大当たり!!
  Fever.text('リーチ!!', { ms: 1300, dark: true, cls: 'red' }); Sound.sfx('reach');
  later(() => { Fever.text('激アツ!!', { ms: 1100, dark: true, cls: 'red' }); Sound.sfx('gekiatsu'); shake(); }, 1300);
  later(() => {
    Fever.flash(); Fever.on(); Sound.sfx('kyuin');
    Fever.text('大当たり!!', { ms: 1700 });
    later(() => { Sound.sfx('pachiFanfare'); Sound.sfx('jara'); }, 350);
    W.classList.add('show-real'); Confetti.burst(200, .5, .4); Confetti.rain(120); shake();
  }, 2400);
  later(() => { W.classList.add('show-owner'); Sound.sfx(anyFooled ? 'boing' : 'slideDown'); }, 4300);
  if (r.pick) later(() => { W.classList.add('show-pick'); Fever.flash(); Sound.sfx('kyuin'); Fever.text('言いそう<br>大賞!!', { ms: 1300, cls: 'rainbow mid' }); Confetti.burst(100, .5, .5); }, 5300);
  later(() => { W.classList.add('show-score'); Sound.sfx(myD ? 'coin' : 'buzzer'); if (myD >= 3) { Sound.sfx('applause'); Confetti.rain(100); } }, r.pick ? 6900 : 5400);
  later(() => Sound.song('kakuhen'), 7300);
  later(() => Fever.off(), 10500);
}

// ---------- 最終結果 ----------
function calcAwards(ps) {
  const out = [];
  const best = (key, emoji, title, desc) => { const m = Math.max(...ps.map(p => p.stats[key] || 0)); if (m > 0) out.push({ emoji, title, desc: desc.replace('N', m), names: ps.filter(p => (p.stats[key] || 0) === m) }); };
  best('picked', '🏆', '言いそうマスター', '言いそう大賞 N回');
  best('fooled', '🎭', 'ペテン師賞', 'N回だました');
  best('correct', '🔍', '名探偵賞', 'N回本物を見抜いた');
  best('guessedBy', '📖', 'わかりやすい人賞', 'のべN人に見抜かれた');
  best('sync', '🌀', 'シンクロ賞', 'N回完全一致');
  const vals = ps.map(p => p.stats.guessedBy), mn = Math.min(...vals);
  if (ps.length >= 3 && Math.max(...vals) !== mn) out.push({ emoji: '🕶️', title: 'ミステリアス賞', desc: `見抜かれたのは${mn}人だけ`, names: ps.filter(p => p.stats.guessedBy === mn) });
  return out;
}
function buildFinal() {
  const ps = view.players.filter(p => view.order.includes(p.id)).sort((a, b) => b.score - a.score || b.stats.picked - a.stats.picked);
  let rank = 0; const ranks = ps.map((p, i) => { if (i === 0 || p.score !== ps[i - 1].score || p.stats.picked !== ps[i - 1].stats.picked) rank = i + 1; return rank; });
  const pod = (i) => { const p = ps[i]; if (!p) return '<div class="pod"></div>'; const n = ranks[i];
    return `<div class="pod p${Math.min(n, 3)}" id="pod${i}">${n === 1 ? '<div class="crown">👑</div>' : ''}${avatarHtml(p)}<div class="pname">${esc(p.name)}</div><div class="pscore">${p.score}点</div><div class="block">${n}</div></div>`; };
  const awards = calcAwards(ps);
  const winners = ps.filter((p, i) => ranks[i] === 1);
  app.innerHTML = `
  <div class="center"><h1 class="logo small"><span>最終</span><span>結果！</span></h1></div>
  <div class="podium">${pod(1)}${pod(0)}${pod(2)}</div>
  <div class="panel stage-final" id="winBox" style="opacity:0;transition:opacity .4s">
    <div class="mydelta">🎉 優勝 ${winners.map(w => esc(w.name)).join('・')} 🎉</div>
    <h2 class="h2">ランキング</h2>
    ${ps.map((p, i) => `<div class="srow ${p.id === me.pid ? 'me' : ''}"><span class="rank">${ranks[i]}</span>${avatarHtml(p)}<span class="sname">${esc(p.name)}</span><span class="reasons"></span><span class="score">${p.score}</span></div>`).join('')}
    ${awards.length ? `<h2 class="h2">🏅 表彰</h2>${awards.map(a => `<div class="award"><span class="em">${a.emoji}</span><div><div class="at">${a.title}</div><div class="ad">${esc(a.desc)}</div></div><div class="an">${a.names.map(n => avatarHtml(n, 'sm') + esc(n.name)).join(' ')}</div></div>`).join('')}` : ''}
  </div>
  <div class="ctl">
    ${me.isHost ? '<button class="btn pink big pulse" id="againBtn">🔁 もう一回あそぶ！</button>' : '<div class="wait-msg">ホストが次のゲームを始めるのを待っています…</div>'}
    <button class="btn small ghost" id="exitBtn">🏠 トップへもどる</button>
  </div>`;
  if (me.isHost) $('#againBtn').onclick = () => send({ t: 'again' });
  $('#exitBtn').onclick = () => me.isHost ? confirmLeave() : exitToTop();
  // パチンコ風スロット：3つのリールが優勝者でそろったら大当たり!!
  const R = Fever.reels(ps, ps[0]);
  later(() => R.stop(0), 1300);
  later(() => R.stop(1), 2300);
  later(() => { R.msg('リーチ!!', 'red'); R.slow(2); Sound.sfx('reach'); }, 2500);
  later(() => { R.msg('激アツ!!', 'red'); Sound.sfx('gekiatsu'); Fever.on(); shake(); }, 3800);
  later(() => { R.stop(2); R.msg('大当たり!!', 'rainbow'); Fever.flash(); Sound.sfx('kyuin'); Confetti.burst(220); shake(); }, 5000);
  later(() => { Sound.sfx('pachiFanfare'); Sound.sfx('jara'); Confetti.rain(200); }, 5350);
  const T = 8000;
  later(() => Fever.hide(), T);
  const up = (i, sfx, at) => later(() => { const el = $('#pod' + i); if (el) { el.classList.add('up'); Sound.sfx(sfx); } }, at);
  up(2, 'slideUp', T + 300); up(1, 'slideUp', T + 1100);
  later(() => { const el = $('#pod0'); if (el) el.classList.add('up'); Fever.flash(); Sound.sfx('kyuin'); Sound.sfx('applause'); Confetti.rain(220); Confetti.burst(160); shake(); Sound.song('kakuhen'); }, T + 2000);
  later(() => { $('#winBox').style.opacity = 1; Sound.sfx('airhorn'); Fever.text(`優勝<br>${winners.map(w => esc(w.name)).join('・')}`, { ms: 2200, cls: 'rainbow mid' }); }, T + 2800);
  later(() => Confetti.rain(150), T + 5000);
  later(() => { Fever.off(); Sound.song('final'); }, T + 14000);
}

/* ===================== タイマー表示 ===================== */
let lastTick = -1;
setInterval(() => {
  const el = $('#timer'); if (!el || !view) return;
  const ms = Math.max(0, localDeadline - Date.now()), sec = Math.ceil(ms / 1000);
  el.querySelector('b').textContent = sec;
  const tot = view.phase === 'answer' ? view.answerTime : view.phase === 'vote' ? CONFIG.VOTE_TIME : CONFIG.RESULT_TIME;
  el.style.setProperty('--p', Math.min(1, ms / 1000 / tot).toFixed(3));
  const tense = view.phase === 'answer' || view.phase === 'vote';
  el.classList.toggle('hurry', tense && sec <= 10);
  if (tense && sec <= 5 && sec > 0 && sec !== lastTick) { lastTick = sec; Sound.sfx('tick'); }
}, 100);

/* ===================== サウンド切り替えボタン ===================== */
function refreshToggles() {
  $('#bgmBtn').classList.toggle('off', !Sound.bgmOn);
  $('#sfxBtn').classList.toggle('off', !Sound.sfxOn);
  $('#ttsBtn').classList.toggle('off', !ttsOn);
  $('#fxBtn').classList.toggle('off', !effectsOn);
}
$('#fxBtn').onclick = () => { effectsOn = !effectsOn; store.set('effects', effectsOn); if (!effectsOn) Fever.off(); refreshToggles(); toast(effectsOn ? '派手演出 オン✨（虹色の点滅あり）' : '派手演出 オフ（点滅なし）'); };
$('#abortBtn').onclick = () => confirmDialog('ゲームを強制終了して、みんなをロビーに戻しますか？', '⏹ 強制終了する', () => send({ t: 'abort' }));
$('#bgmBtn').onclick = () => { Sound.init(); Sound.setBgm(!Sound.bgmOn); refreshToggles(); toast(Sound.bgmOn ? 'BGM オン🎵' : 'BGM オフ'); };
$('#sfxBtn').onclick = () => { Sound.init(); Sound.setSfx(!Sound.sfxOn); refreshToggles(); Sound.sfx('pop'); toast(Sound.sfxOn ? '効果音 オン🔔' : '効果音 オフ'); };
$('#ttsBtn').onclick = () => { ttsOn = !ttsOn; store.set('tts', ttsOn); refreshToggles(); toast(ttsOn ? '読み上げ オン🗣️（同じ部屋で遊ぶなら1台だけオンがおすすめ）' : '読み上げ オフ'); if (ttsOn) speak('読み上げ、オン！'); };
refreshToggles();

// 最初のタップで音を解禁 & ボタンのクリック音
document.addEventListener('pointerdown', e => { Sound.init(); if (e.target.closest('.btn')) Sound.sfx('click'); }, true);
document.addEventListener('keydown', () => Sound.init(), { once: true });
window.addEventListener('beforeunload', e => { if (me.isHost && Host.s && Host.s.players.length > 1) { e.preventDefault(); e.returnValue = ''; } });
if ('speechSynthesis' in window) try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch {}

/* ===================== 起動 ===================== */
(() => {
  const saved = ss.get('room');
  if (saved && me.name) joinRoom(saved); // リロード時は自動で再参加
  else renderHome();
})();
</script>
</body>
</html>
