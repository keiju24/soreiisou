<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本部 デバッグ</title>
<style>
  :root { --panel:rgba(18,20,24,.86); --line:#3a3f48; --hi:#9fe28c; }
  html, body { margin:0; height:100%; overflow:hidden; background:#cfd7de; font-family:system-ui, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; }
  canvas { display:block; width:100%; height:100%; }
  #panel { position:fixed; left:12px; top:12px; width:250px; background:var(--panel); color:#e8ecf2; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.6; }
  #panel h1 { margin:0 0 6px; font-size:14px; display:flex; justify-content:space-between; }
  #panel h1 small { color:#9aa3ae; font-weight:400; }
  #panel .row { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
  #panel button { font:inherit; padding:3px 10px; border-radius:6px; border:1px solid var(--line); background:#232a38; color:#fff; cursor:pointer; }
  #panel button.on { background:#3f5f2e; border-color:var(--hi); }
  #panel label { display:flex; align-items:center; gap:6px; }
  #panel b { color:#9aa3ae; font-weight:400; display:inline-block; width:56px; }
  #panel code { color:var(--hi); }
  #keys { position:fixed; right:12px; bottom:12px; background:var(--panel); color:#e8ecf2; border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:12px; line-height:1.7; }
  kbd { display:inline-block; padding:0 5px; border:1px solid #6b7280; border-radius:4px; background:#2a303b; font-family:inherit; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; color:#333; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">本部を読みこみ中…</div>
<div id="panel">
  <h1>本部 デバッグ <small>models/hq.glb</small></h1>
  <div class="row" id="floorBtns"></div>
  <label><input type="checkbox" id="lower" checked> 下の階も見せる</label>
  <label><input type="checkbox" id="shadow" checked> 影</label>
  <label><input type="checkbox" id="spin"> ターンテーブル</label>
  <div class="row"><button id="camGame">ゲームの視点</button><button id="camFront">正面</button><button id="camTop">真上</button></div>
  <div><b>FPS</b><code id="vFps">-</code></div>
  <div><b>カメラ</b><code id="vCam">-</code></div>
</div>
<div id="keys">
  左ドラッグ 回す　右ドラッグ 動かす　ホイール ズーム<br>
  <kbd>1</kbd> 1F　<kbd>2</kbd> 2F　<kbd>3</kbd> 屋上　<kbd>4</kbd> ぜんぶ
</div>
<script type="importmap">{ "imports": { "playcanvas": "./lib/playcanvas.min.mjs" } }</script>
<script type="module">
// 本部（Blender で作った models/hq.glb）を見るページ。tools/blender/hq_build.py で作り直せる
// glb のいちばん上の節：F1・F2・RF（屋上）・ST1（1F→2F 階段）・ST2（2F→屋上 階段）
import { Application, Entity, Color, Vec3, Asset, FILLMODE_FILL_WINDOW, RESOLUTION_AUTO, TONEMAP_ACES, GAMMA_SRGB, SHADOW_PCF3_32F } from 'playcanvas';
const $ = (id) => document.getElementById(id);
const canvas = $('c');
const app = new Application(canvas, { graphicsDeviceOptions: { antialias: true } });
app.setCanvasFillMode(FILLMODE_FILL_WINDOW); app.setCanvasResolution(RESOLUTION_AUTO);
app.graphicsDevice.maxPixelRatio = Math.min(2, devicePixelRatio || 1);
addEventListener('resize', () => app.resizeCanvas());
app.scene.ambientLight = new Color(.5, .53, .58);
app.start();

const sun = new Entity(); sun.addComponent('light', { type: 'directional', color: new Color(1, .96, .9), intensity: 1.6, castShadows: true, shadowDistance: 60, shadowResolution: 2048, shadowBias: .25, normalOffsetBias: .04, shadowType: SHADOW_PCF3_32F });
sun.setLocalEulerAngles(55, 25, 0); app.root.addChild(sun);
const fill = new Entity(); fill.addComponent('light', { type: 'directional', color: new Color(.8, .88, 1), intensity: .5 }); fill.setLocalEulerAngles(35, -150, 0); app.root.addChild(fill);
const camE = new Entity(); camE.addComponent('camera', { clearColor: new Color(.81, .85, .89), fov: 40, nearClip: .2, farClip: 300, toneMapping: TONEMAP_ACES, gammaCorrection: GAMMA_SRGB });
app.root.addChild(camE);

// ---- 階の切りかえ ----
const FH = 4.6, RW = 22, RD = 12;
const FLOORS = [
  { key: '1F', y: 0, show: ['F1', 'ST1'], lower: [] },
  { key: '2F', y: FH, show: ['F2', 'ST1', 'ST2'], lower: ['F1'] },
  { key: '屋上', y: FH * 2, show: ['RF', 'ST2'], lower: ['F1', 'F2', 'ST1'] },
  { key: 'ぜんぶ', y: FH, show: ['F1', 'F2', 'RF', 'ST1', 'ST2'], lower: [] },
];
let hq = null, nodes = {}, floorIx = 0;
FLOORS.forEach((f, i) => { const b = document.createElement('button'); b.textContent = f.key; b.onclick = () => setFloor(i); $('floorBtns').appendChild(b); });
function setFloor(i) {
  floorIx = i; const f = FLOORS[i], vis = new Set([...f.show, ...($('lower').checked ? f.lower : [])]);
  for (const [k, n] of Object.entries(nodes)) n.enabled = vis.has(k);
  [...$('floorBtns').children].forEach((b, k) => b.classList.toggle('on', k === i));
  cam.tgt.y = f.y + 1;
}
$('lower').onchange = () => setFloor(floorIx);
$('shadow').onchange = () => { sun.light.castShadows = $('shadow').checked; };

// ---- カメラ（左ドラッグで回す・右ドラッグで動かす・ホイールでズーム）----
const cam = { yaw: 0, pitch: 50, dist: 26, tgt: new Vec3(RW / 2, 1, -RD / 2) };
const preset = { game: [0, 50, 26], front: [0, 12, 26], top: [0, 89, 30] };
const usePreset = (k) => { [cam.yaw, cam.pitch, cam.dist] = preset[k]; cam.tgt.x = RW / 2; cam.tgt.z = -RD / 2; };
$('camGame').onclick = () => usePreset('game'); $('camFront').onclick = () => usePreset('front'); $('camTop').onclick = () => usePreset('top');
let drag = null;
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, b: e.button }; canvas.setPointerCapture(e.pointerId); });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', (e) => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.b === 0) { cam.yaw -= dx * .3; cam.pitch = Math.max(2, Math.min(89, cam.pitch + dy * .25)); }
  else { const k = cam.dist * .0016, a = cam.yaw * Math.PI / 180; cam.tgt.x -= (Math.cos(a) * dx - Math.sin(a) * dy) * k; cam.tgt.z -= (-Math.sin(a) * dx - Math.cos(a) * dy) * k; }
});
canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = Math.max(3, Math.min(80, cam.dist * Math.exp(e.deltaY * .001))); }, { passive: false });
addEventListener('keydown', (e) => { const n = +e.key; if (n >= 1 && n <= 4) setFloor(n - 1); });

// ---- 読みこみ ----
const asset = new Asset('hq', 'container', { url: 'models/hq.glb' });
app.assets.add(asset);
asset.ready(() => {
  hq = asset.resource.instantiateRenderEntity({ castShadows: true, receiveShadows: true });
  app.root.addChild(hq);
  for (const k of ['F1', 'F2', 'RF', 'ST1', 'ST2']) nodes[k] = hq.findByName(k);
  $('loading').remove();
  setFloor(0);
  window.__dbg = { app, hq, nodes, setFloor, cam };
});
asset.on('error', (e) => { $('loading').textContent = '読みこみ失敗：' + e; });
app.assets.load(asset);

let fpsT = 0, fpsN = 0;
app.on('update', (dt) => {
  fpsT += dt; fpsN++; if (fpsT > .5) { $('vFps').textContent = (fpsN / fpsT).toFixed(0); fpsT = 0; fpsN = 0; }
  if ($('spin').checked) cam.yaw += dt * 12;
  const a = cam.yaw * Math.PI / 180, p = cam.pitch * Math.PI / 180;
  camE.setPosition(cam.tgt.x + Math.sin(a) * Math.cos(p) * cam.dist, cam.tgt.y + Math.sin(p) * cam.dist, cam.tgt.z + Math.cos(a) * Math.cos(p) * cam.dist);
  camE.lookAt(cam.tgt);
  $('vCam').textContent = `${cam.yaw.toFixed(0)}° / ${cam.pitch.toFixed(0)}° / ${cam.dist.toFixed(1)}m`;
});
</script>
</body>
</html>
