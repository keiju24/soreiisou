<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バトル デバッグ</title>
<link rel="preload" href="fonts/LightNovelPOPv2.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: 'FWB'; src: url('fonts/LightNovelPOPv2.woff2') format('woff2'); font-display: block; }
  :root { --panel: rgba(18, 20, 24, .86); --line: #3a3f48; --hi: #9fe28c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc8ee; font-family: system-ui, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 22px 'FWB', sans-serif; color: #234; background: #9cc8ee; z-index: 50; }
  /* ---- 左上：HP・妖気・デバッグ ---- */
  #hud { position: fixed; left: 12px; top: 12px; width: 300px; color: #fff; font: 14px 'FWB', sans-serif; }
  .bar { position: relative; height: 16px; border: 3px solid #111; border-radius: 10px; background: #333; overflow: hidden; margin: 2px 0 8px; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; transition: width .12s; }
  #hpBar i { background: linear-gradient(#9cf07a, #3fb52a); }
  #ykBar i { background: linear-gradient(#ffe27a, #f0a020); }
  #ykBar.full { box-shadow: 0 0 10px 3px #ffd84a; }
  .lbl { -webkit-text-stroke: 4px #111; paint-order: stroke fill; }
  #dbg { margin-top: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: 12px/1.6 system-ui, sans-serif; color: #e8ecf2; }
  #dbg .g { display: grid; grid-template-columns: 70px 1fr; }
  #dbg b { color: #9aa3ae; font-weight: 400; }
  #dbg code { color: var(--hi); }
  #dbg button { font: inherit; padding: 2px 8px; margin: 4px 4px 0 0; border-radius: 6px; border: 1px solid var(--line); background: #232a38; color: #fff; cursor: pointer; }
  #dbg button.on { background: #3f5f2e; border-color: var(--hi); }
  #ed summary { cursor: pointer; margin-top: 6px; color: #ffd166; }
  #ed select { width: 100%; margin: 4px 0; font: inherit; background: #232a38; color: #fff; border: 1px solid var(--line); border-radius: 6px; }
  #ed label { display: grid; grid-template-columns: 96px 1fr 40px; align-items: center; gap: 4px; }
  #ed input[type=range] { width: 100%; }
  #testOut { max-height: 34vh; overflow: auto; margin-top: 4px; }
  #testOut small { color: #9aa3ae; }
  /* ---- 右下：技アイコン ---- */
  #skills { position: fixed; right: 18px; bottom: 18px; display: grid; grid-template-columns: repeat(2, 86px); grid-template-rows: 86px 92px; gap: 26px 14px; align-items: center; justify-items: center; }
  .sk { position: relative; width: 78px; height: 78px; border-radius: 50%; border: 4px solid #111; background: #f6f1e0; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
  .sk svg { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); transition: filter .1s; }
  .sk .cd { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }
  .sk .ch { position: absolute; inset: -9px; border-radius: 50%; pointer-events: none; }
  .sk .key { position: absolute; right: -8px; bottom: -6px; min-width: 26px; height: 26px; padding: 0 4px; border-radius: 13px; background: #111; color: #fff; font: 15px/26px 'FWB', sans-serif; text-align: center; }
  .sk .slot { position: absolute; left: -8px; top: -8px; width: 28px; height: 28px; border-radius: 50%; background: #f0c048; border: 3px solid #111; font: 15px/23px 'FWB', sans-serif; text-align: center; color: #111; }
  .sk .nm { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 4px); white-space: nowrap; font: 12px 'FWB', sans-serif; color: #fff; -webkit-text-stroke: 3px #111; paint-order: stroke fill; }
  .sk .sec { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font: 22px 'FWB', sans-serif; color: #fff; -webkit-text-stroke: 4px #111; paint-order: stroke fill; pointer-events: none; }
  .sk.ready { animation: ready .45s ease-out; }
  @keyframes ready { 0% { box-shadow: 0 0 0 0 #fff8b0, 0 4px 0 rgba(0, 0, 0, .35); } 40% { box-shadow: 0 0 18px 10px #fff8b0, 0 4px 0 rgba(0, 0, 0, .35); } 100% { box-shadow: 0 0 0 0 #fff8b0, 0 4px 0 rgba(0, 0, 0, .35); } }
  .sk.max { border-color: #ffd84a; box-shadow: 0 0 14px 5px #ffd84a, 0 4px 0 rgba(0, 0, 0, .35); }
  .sk.sp.full { animation: glow 1s ease-in-out infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 6px 2px #ffd84a; } to { box-shadow: 0 0 22px 10px #ffb02a; } }
  #skA { grid-column: 2; grid-row: 2; width: 92px; height: 92px; }
  #skX { grid-column: 1; grid-row: 1; } #skY { grid-column: 2; grid-row: 1; } #skSP { grid-column: 1; grid-row: 2; }
  /* ---- ダメージの数字・必殺技の名前・お知らせ ---- */
  #nums { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .num { position: absolute; transform: translate(-50%, -50%); font: 30px 'FWB', sans-serif; color: #fff; -webkit-text-stroke: 6px #111; paint-order: stroke fill; white-space: nowrap; animation: num .8s ease-out forwards; }
  .num.crit { font-size: 42px; color: #ffcf3a; }
  .num.heal { color: #7cf07a; }
  .num.player { color: #ff7a6a; font-size: 26px; }
  .num.info { font-size: 22px; color: #bfe9ff; }
  @keyframes num { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; } 18% { transform: translate(-50%, -60%) scale(1.25); } 30% { transform: translate(-50%, -70%) scale(1); } 100% { transform: translate(-50%, -190%) scale(1); opacity: 0; } }
  .ehp { position: absolute; width: 70px; height: 8px; border: 2px solid #111; border-radius: 6px; background: #333; transform: translate(-50%, -50%); overflow: hidden; }
  .ehp i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#ff8a6a, #d23a2a); }
  .ehp b { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font: 12px 'FWB', sans-serif; color: #fff; -webkit-text-stroke: 3px #111; paint-order: stroke fill; white-space: nowrap; }
  #banner { position: fixed; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; opacity: 0; }
  #banner span { display: inline-block; padding: 8px 40px; font: 52px 'FWB', sans-serif; color: #ffe04a; -webkit-text-stroke: 8px #2a1a00; paint-order: stroke fill; background: linear-gradient(90deg, transparent, rgba(255, 120, 20, .7) 20%, rgba(255, 120, 20, .7) 80%, transparent); transform: skewX(-8deg); }
  #banner.on { animation: banner 1.4s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; transform: translateX(-60px) scale(1.4); } 12% { opacity: 1; transform: translateX(0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(40px); } }
  #flash { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle, rgba(255,255,240,.0) 30%, rgba(255,250,210,1) 100%); opacity: 0; }
  #toast { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); padding: 8px 18px; border-radius: 10px; background: rgba(0, 0, 0, .7); color: #fff; font: 18px 'FWB', sans-serif; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }
  #keys { position: fixed; left: 12px; bottom: 12px; background: var(--panel); color: #e8ecf2; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font: 12px/1.7 system-ui, sans-serif; }
  kbd { display: inline-block; padding: 0 5px; border: 1px solid #6b7280; border-radius: 4px; background: #2a303b; font-family: inherit; }
  /* ---- 技セット変更 ---- */
  #ts { position: fixed; inset: 0; display: none; z-index: 30; }
  #ts.on { display: block; }
  #ts .card { position: absolute; right: 3vw; top: 4vh; bottom: 4vh; width: min(560px, 56vw); border: 5px solid #111; border-radius: 22px; background: #8b52e6 repeating-linear-gradient(0deg, rgba(255, 255, 255, .06) 0 2px, transparent 2px 6px); color: #111; font-family: 'FWB', sans-serif; display: flex; flex-direction: column; padding: 16px 18px; box-sizing: border-box; gap: 10px; overflow: auto; }
  #ts h2 { margin: 0; font-weight: normal; font-size: 30px; color: #23206b; background: #ffe31a; border-radius: 12px; padding: 4px 16px; align-self: flex-start; }
  #ts .who { font-size: 22px; color: #fff; -webkit-text-stroke: 5px #23206b; paint-order: stroke fill; }
  .tslots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tslot { display: flex; align-items: center; gap: 10px; border: 4px solid #111; border-radius: 14px; padding: 6px 10px; background: linear-gradient(#ecdcff, #c9a6fb); cursor: pointer; font-size: 17px; }
  .tslot.fixed { cursor: default; opacity: .9; background: linear-gradient(#eee, #cfcfd6); }
  .tslot.cur { background: linear-gradient(#fff38a, #ffd900); }
  .tslot .s { width: 34px; height: 34px; border-radius: 50%; background: #111; color: #fff; text-align: center; line-height: 34px; flex: none; }
  .tslot small { display: block; font-size: 12px; color: #5a4a7a; }
  .tlist { display: flex; flex-direction: column; gap: 6px; }
  .titem { display: flex; align-items: center; gap: 10px; border: 3px solid #111; border-radius: 12px; padding: 4px 10px; background: #f6f1e0; cursor: pointer; font-size: 17px; }
  .titem svg { width: 36px; height: 36px; flex: none; }
  .titem.cur { background: #fff38a; }
  .titem.lock { opacity: .45; cursor: default; }
  .titem.used::after { content: 'セット中'; margin-left: auto; font-size: 12px; background: #111; color: #fff; border-radius: 8px; padding: 1px 6px; }
  .tdesc { background: #5a2fa8; color: #fff; border-radius: 14px; padding: 10px 14px; font-size: 15px; line-height: 1.6; }
  .tdesc table { margin-top: 6px; font-size: 14px; }
  .tdesc td:first-child { color: #ffe31a; padding-right: 14px; }
  .tbtns { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
  .tbtns button { font: 20px 'FWB', sans-serif; padding: 6px 22px; border: 4px solid #111; border-radius: 14px; background: linear-gradient(#efe3ff, #d2b4fd); cursor: pointer; }
  .tbtns label { color: #fff; font-size: 14px; -webkit-text-stroke: 3px #23206b; paint-order: stroke fill; }
  .tbtns input { width: 52px; font: 14px system-ui; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">バトルを準備中…</div>
<div id="hud">
  <div class="lbl" id="who">インポニャン</div>
  <div class="bar" id="hpBar"><i style="width:100%"></i></div>
  <div class="lbl">妖気 <span id="ykTxt">0%</span></div>
  <div class="bar" id="ykBar"><i style="width:0%"></i></div>
  <div id="dbg">
    <div class="g"><b>状態</b><code id="vState">-</code><b>アニメ</b><code id="vClip">-</code><b>コンボ</b><code id="vCombo">-</code><b>無敵</b><code id="vInv">-</code><b>FPS</b><code id="vFps">-</code></div>
    <button id="bAtk" class="on">敵の攻撃</button><button id="bYk">妖気MAX</button><button id="bHeal">HP回復</button><button id="bRev">復活</button><button id="bHit">当たり判定</button><button id="bTs">技セット変更</button><button id="bTest">判定テスト</button>
    <details id="ed"><summary>判定エディタ</summary><select id="edSel"></select><div id="edRows"></div><button id="edCopy">JSONをコピー</button></details>
    <div id="testOut"></div>
  </div>
</div>
<div id="nums"></div>
<div id="banner"><span id="bannerTxt"></span></div>
<div id="flash"></div>
<div id="toast"></div>
<div id="skills"></div>
<div id="keys"><kbd>WASD</kbd> 走る　<kbd>Shift</kbd> ダッシュ　<kbd>Q</kbd> 歩く　<kbd>J</kbd>/左クリック A　<kbd>K</kbd> X　<kbd>L</kbd> Y　<kbd>U</kbd> 必殺技　<kbd>T</kbd> 技セット　<kbd>R</kbd> ロックオン　右ドラッグ 視点</div>
<div id="ts"><div class="card">
  <h2>技セット変更</h2>
  <div class="who" id="tsWho"></div>
  <div class="tslots" id="tsSlots"></div>
  <div class="tlist" id="tsList"></div>
  <div class="tdesc" id="tsDesc"></div>
  <div class="tbtns"><button id="tsClose">もどる</button><label>レベル（デバッグ） <input type="number" id="tsLv" min="1" max="99" value="1"></label></div>
</div></div>
<script type="importmap">{ "imports": { "playcanvas": "./lib/playcanvas.min.mjs" } }</script>
<script type="module">
// =====================================================================
//  バトル デバッグ：インポニャン（妖怪ウォッチバスターズ風の操作感）
//  数値はぜんぶ data/fwb-skills.json。マップは models/schoolyard.glb（当たり判定 .col.json）
//  ステート：Idle Walk Run Dash / Attack1-3 / ChargeStart ChargeLoop ChargeAttack / PowerAttack / FireCharge FireAttack /
//            Dodge / SpecialAttack / Damage DamageHeavy Knockback Down GetUp / Dead
// =====================================================================
import { Application, Entity, Color, Vec3, Quat, Asset, Texture, StandardMaterial, FILLMODE_FILL_WINDOW, RESOLUTION_AUTO, TONEMAP_ACES, GAMMA_SRGB,
  SHADOW_PCF3_32F, BLEND_NORMAL, BLEND_ADDITIVEALPHA, CULLFACE_NONE, PIXELFORMAT_RGBA8, Mesh, MeshInstance } from 'playcanvas';
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sm = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const angTo = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const MAP = 'schoolyard', CHAR = 'imponyan';

const canvas = $('c');
const app = new Application(canvas, { graphicsDeviceOptions: { antialias: true } });
app.setCanvasFillMode(FILLMODE_FILL_WINDOW); app.setCanvasResolution(RESOLUTION_AUTO);
app.graphicsDevice.maxPixelRatio = Math.min(2, devicePixelRatio || 1);
addEventListener('resize', () => app.resizeCanvas());
app.scene.ambientLight = new Color(.55, .58, .64);
app.start();
const sun = new Entity(); sun.addComponent('light', { type: 'directional', color: new Color(1, .96, .9), intensity: 1.6, castShadows: true, shadowDistance: 40, shadowResolution: 2048, shadowBias: .3, normalOffsetBias: .05, shadowType: SHADOW_PCF3_32F });
sun.setLocalEulerAngles(50, 30, 0); app.root.addChild(sun);
const fill = new Entity(); fill.addComponent('light', { type: 'directional', color: new Color(.8, .88, 1), intensity: .45 }); fill.setLocalEulerAngles(35, -150, 0); app.root.addChild(fill);
const camE = new Entity(); camE.addComponent('camera', { clearColor: new Color(.61, .78, .93), fov: 45, nearClip: .1, farClip: 400, toneMapping: TONEMAP_ACES, gammaCorrection: GAMMA_SRGB });
app.root.addChild(camE);

// =====================================================================
//  読みこみ（技データ・マップ・当たり判定・キャラ）
// =====================================================================
let D = null, COL = { box: [], circle: [], bounds: null, start: [0, 0, 0] };
const loadAsset = (url) => new Promise((res, rej) => { const a = new Asset(url, 'container', { url }); app.assets.add(a); a.ready(() => res(a.resource)); a.on('error', rej); app.assets.load(a); });
const [skillsJson, colJson, mapRes, heroRes] = await Promise.all([
  fetch('data/fwb-skills.json', { cache: 'no-cache' }).then(r => r.json()),
  fetch(`models/${MAP}.col.json`).then(r => r.json()).catch(() => ({})),
  loadAsset(`models/${MAP}.glb`), loadAsset(`models/${CHAR}.glb`),
]);
D = skillsJson; Object.assign(COL, colJson);
const G = D.global, SK = D.skills, CH = D.characters[CHAR], FX = D.effects;
{ const m = mapRes.instantiateRenderEntity({ castShadows: true, receiveShadows: true }); app.root.addChild(m); }

// ---- キャラ ----
const hero = heroRes.instantiateRenderEntity({ castShadows: true }); app.root.addChild(hero);
const matte = (e) => e.findComponents('render').forEach(r => r.meshInstances.forEach(mi => { const m = mi.material; if (m.__matte) return; m.__matte = 1; if (m.glossInvert) m.gloss = Math.max(m.gloss, .78); else m.gloss = Math.min(m.gloss, .22); m.specularityFactor = .3; m.update(); }));
matte(hero);
const noCull = (e) => e.findComponents('render').forEach(r => r.meshInstances.forEach(mi => mi.cull = false));   // 骨で動くメッシュの箱が 原点のままなので、見えなくならないように
noCull(hero);
hero.addComponent('anim', { activate: true });
const clipLen = {};
for (const x of heroRes.animations) {
  const tr = x.resource, nm = tr.name.replace(/^.*\|/, ''), loop = /^(idle|walk|run|dash|charge_loop|fire_charge|down|dead)$/.test(nm);
  hero.anim.assignAnimation(nm, tr, undefined, 1, loop); hero.anim.assignAnimation(nm + '~', tr, undefined, 1, loop);   // ~：同じアニメを はじめから もう一度
  clipLen[nm] = tr.duration;
}
const bone = (n) => hero.findByName(n);
const B = { fistR: bone('fist.R'), fistL: bone('fist.L'), hips: bone('hips'), ears: [bone('ear.L'), bone('ear.R')], bell: bone('bell'),
  tails: ['L', 'R'].map(s => [1, 2, 3].map(k => bone(`tail${k}.${s}`))) };
let curClip = '', curAlias = '', animSpeed = 1;
function playClip(name, fade = .1, speed = 1) {
  const alias = (curClip === name) ? (curAlias === name ? name + '~' : name) : name;
  hero.anim.baseLayer.transition(alias, fade, 0); curClip = name; curAlias = alias; animSpeed = speed;
}
// 残像用のコピー（ポーズを写して、すけさせて消す）
const ghosts = [];
for (let i = 0; i < (FX.afterimage.count || 3); i++) {
  const g = heroRes.instantiateRenderEntity({ castShadows: false }); app.root.addChild(g); g.enabled = false;
  const m = new StandardMaterial(); m.diffuse = new Color(.7, .85, 1); m.emissive = new Color(.45, .6, 1); m.opacity = .4; m.blendType = BLEND_NORMAL; m.depthWrite = false; m.useLighting = false; m.update();
  g.findComponents('render').forEach(r => r.meshInstances.forEach(mi => mi.material = m)); noCull(g);
  const map = {}; g.forEach(n => { if (n.name) map[n.name] = n; });
  ghosts.push({ e: g, m, map, t: 0, life: 0 });
}
const heroNodes = []; hero.forEach(n => { if (n.name && n !== hero) heroNodes.push(n); });

// =====================================================================
//  技セット（セーブ）・クールタイム・妖気
// =====================================================================
const TS_KEY = 'fwb2.techset.' + CHAR, LV_KEY = 'fwb2.level';
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
let level = store.get(LV_KEY, 1);
const learned = (id) => { const L = SK[id].learn; return !L || level >= (L.level || 1); };
let techset = Object.assign({}, CH.defaultSet, store.get(TS_KEY, {}));
for (const s of ['X', 'Y']) if (!CH.selectable.includes(techset[s]) || !learned(techset[s])) techset[s] = CH.defaultSet[s];
if (techset.X === techset.Y) techset = Object.assign({}, CH.defaultSet);
const slotSkill = (s) => s === 'A' ? CH.fixed.A : s === 'SP' ? CH.fixed.special : techset[s];
const cd = {}, cdMax = {};                 // 技ごとのクールタイム（のこり・長さ）
function startCooldown(id) { const c = SK[id].cooldown || 0; if (c > 0) { cd[id] = c; cdMax[id] = c; } }
let yokai = 0, hp = CH.hp, lastCombat = -99, now = 0;

// =====================================================================
//  入力
// =====================================================================
const keys = new Set(), pressed = new Set(), released = new Set();
const SLOT_KEYS = { KeyJ: 'A', KeyK: 'X', KeyL: 'Y', KeyU: 'SP' };
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  audioUnlock();
  if (e.repeat) return;
  keys.add(e.code); pressed.add(e.code);
  if (e.code === 'KeyT') toggleTechset();
  if (e.code === 'KeyR') toggleLock();
  if (e.code === 'Escape' && $('ts').classList.contains('on')) toggleTechset(false);
});
addEventListener('keyup', (e) => { keys.delete(e.code); released.add(e.code); });
addEventListener('blur', () => { for (const k of keys) released.add(k); keys.clear(); });
const cam = { yaw: 0, pitch: 38, dist: 8.5, zoom: 1, shake: 0, shakeT: 0 };
let drag = null;
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointerdown', (e) => { audioUnlock(); if (e.button === 2) drag = { x: e.clientX, y: e.clientY }; else if (e.button === 0) { keys.add('Mouse0'); pressed.add('Mouse0'); } });
addEventListener('pointerup', (e) => { drag = null; if (e.button === 0 && keys.has('Mouse0')) { keys.delete('Mouse0'); released.add('Mouse0'); } });
addEventListener('pointermove', (e) => { if (!drag) return; cam.yaw -= (e.clientX - drag.x) * .3; cam.pitch = clamp(cam.pitch + (e.clientY - drag.y) * .25, 8, 80); drag = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = clamp(cam.dist * Math.exp(e.deltaY * .001), 3.5, 30); }, { passive: false });
const slotDown = (s) => [...keys].some(k => (SLOT_KEYS[k] || (k === 'Mouse0' ? 'A' : null)) === s);
const slotPressed = (s) => [...pressed].some(k => (SLOT_KEYS[k] || (k === 'Mouse0' ? 'A' : null)) === s);
const slotReleased = (s) => [...released].some(k => (SLOT_KEYS[k] || (k === 'Mouse0' ? 'A' : null)) === s);

// =====================================================================
//  効果音（つくった音。原作の音は使わない）
// =====================================================================

  if (on && (inCombat() || !LOCO.has(P.state))) { toast('戦闘中は 技セットを変更できません'); return; }
  el.classList.toggle('on', on); if (on) { tsPick = techset[tsSel]; renderTs(); }
}
function renderTs() {
  $('tsWho').textContent = CH.name; $('tsLv').value = level;
  const slot = (s, label, id, fixed) => `<div class="tslot${fixed ? ' fixed' : ''}${tsSel === s ? ' cur' : ''}" data-s="${s}"><span class="s">${label}</span><div>${SK[id].name}<small>${fixed ? '変更できない' : 'クリックで えらぶ'}</small></div></div>`;
  $('tsSlots').innerHTML = slot('A', 'A', CH.fixed.A, true) + slot('X', 'X', techset.X) + slot('Y', 'Y', techset.Y) + slot('SP', '必', CH.fixed.special, true) + slot('SK', 'ス', CH.fixed.skill, true);
  $('tsSlots').querySelectorAll('.tslot:not(.fixed)').forEach(e => e.onclick = () => { tsSel = e.dataset.s; tsPick = techset[tsSel]; renderTs(); });
  const ids = CH.selectable, L = ids.filter(learned), U = ids.filter(i => !learned(i));
  $('tsList').innerHTML = '<div style="color:#fff;-webkit-text-stroke:3px #23206b;paint-order:stroke fill">習得ずみ</div>' + L.map(i => `<div class="titem${tsPick === i ? ' cur' : ''}${(techset.X === i || techset.Y === i) ? ' used' : ''}" data-i="${i}">${ICON[SK[i].icon]}${SK[i].name}</div>`).join('') +
    (U.length ? '<div style="color:#fff;-webkit-text-stroke:3px #23206b;paint-order:stroke fill">未習得</div>' + U.map(i => `<div class="titem lock" data-i="${i}">${ICON[SK[i].icon]}${SK[i].name}　<small>${SK[i].learn.text}</small></div>`).join('') : '');
  $('tsList').querySelectorAll('.titem').forEach(e => {
    e.onmouseenter = () => desc(e.dataset.i);
    if (e.classList.contains('lock')) return;
    e.onclick = () => {
      const i = e.dataset.i, other = tsSel === 'X' ? 'Y' : 'X';
      if (techset[other] === i) { toast('同じ技は 両方のスロットに セットできません'); return; }
      techset[tsSel] = i; tsPick = i; store.set(TS_KEY, techset); buildIcons(); renderTs(); toast(`${tsSel}：${SK[i].name} をセット`);
    };
  });
  desc(tsPick || techset[tsSel]);
}
function desc(id) {
  const S = SK[id]; if (!S) return;
  const pow = S.type === 'combo' ? S.steps.map(s => s.power).join(' / ') : S.type === 'special' ? `${S.hitPower} × ${S.hits}` : S.maxPower ? `${S.power}〜${S.maxPower}` : (S.power || '-');
  $('tsDesc').innerHTML = `<b style="font-size:18px">${S.name}</b><br>${S.desc}<table><tr><td>威力</td><td>${pow}</td></tr><tr><td>クールタイム</td><td>${S.cooldown != null ? S.cooldown + '秒' : S.gaugeCost ? '妖気 ' + S.gaugeCost + '%' : '-'}</td></tr><tr><td>属性</td><td>${S.attr}</td></tr>${S.learn ? `<tr><td>習得条件</td><td>${S.learn.text}</td></tr>` : ''}</table>`;
}
$('tsClose').onclick = () => toggleTechset(false);
$('tsLv').onchange = (e) => { level = clamp(+e.target.value || 1, 1, 99); store.set(LV_KEY, level); renderTs(); };
$('bTs').onclick = () => toggleTechset();
$('bAtk').onclick = () => { enemyAttacks = !enemyAttacks; $('bAtk').classList.toggle('on', enemyAttacks); };
$('bYk').onclick = () => { yokai = 100; };
$('bHeal').onclick = () => { hp = CH.hp; popNum('+' + CH.hp, P.pos.clone().add(new Vec3(0, 2, 0)), 'heal'); };
$('bRev').onclick = () => { hp = CH.hp; if (P.state === 'Dead' || P.state === 'Down') setState('GetUp', 'getup', .1); };
$('bHit').onclick = () => { showHit = !showHit; $('bHit').classList.toggle('on', showHit); };

// =====================================================================
//  毎フレーム
// =====================================================================
playClip('idle', 0);
$('loading').remove();
let fpsT = 0, fpsN = 0;
app.on('update', (rdt) => {
  const dt = Math.min(rdt, 1 / 20); now += dt;
  fpsT += rdt; fpsN++; if (fpsT > .5) { $('vFps').textContent = (fpsN / fpsT).toFixed(0); fpsT = 0; fpsN = 0; }
  // ヒットストップ中は キャラと敵の時間を止める（エフェクトは動く）
  let gdt = dt; if (hitstop > 0) { hitstop -= dt; gdt = 0; }
  hero.anim.speed = gdt > 0 ? animSpeed : 0;
  for (const k in cd) if (cd[k] > 0) cd[k] = Math.max(0, cd[k] - gdt);
  if ($('ts').classList.contains('on')) { pressed.clear(); }
  // ボタンの押した・はなした は、ヒットストップで止まっているあいだも 消さずに 次に動いたフレームで使う（先行入力が きえない）
  if (gdt > 0) { playerUpdate(gdt); enemiesUpdate(gdt); shotsUpdate(gdt); pressed.clear(); released.clear(); }
  hero.setLocalPosition(P.pos); hero.setLocalEulerAngles(0, P.face * 57.3, 0);
  for (const g of ghosts) if (g.e.enabled) { g.t += dt; g.m.opacity = FX.afterimage.alpha * (1 - g.t / g.life); g.m.update(); if (g.t >= g.life) g.e.enabled = false; }
  // カメラ（技セット中は キャラの正面から）
  if ($('ts').classList.contains('on')) {
    const f = fwd(); camE.setPosition(P.pos.x + f.x * 3.4 + f.z * 1.2, 1.3, P.pos.z + f.z * 3.4 - f.x * 1.2); camE.lookAt(P.pos.x + f.z * 1.0, .9, P.pos.z - f.x * 1.0);   // キャラが画面の左がわ（パネルにかくれない）
  } else {
    const zoomTarget = cam.zoomT > 0 ? .5 : 1; cam.zoomT = Math.max(0, (cam.zoomT || 0) - dt); cam.zoom += (zoomTarget - cam.zoom) * Math.min(1, dt * 6);
    const ya = cam.yaw * Math.PI / 180, pp = cam.pitch * Math.PI / 180, dist = cam.dist * cam.zoom;
    let sx = 0, sy = 0; if (cam.shakeT > 0) { cam.shakeT -= dt; sx = (Math.random() - .5) * cam.shake; sy = (Math.random() - .5) * cam.shake; }
    const ty = P.pos.y + 1.0;
    camE.setPosition(P.pos.x + Math.sin(ya) * Math.cos(pp) * dist + sx, ty + Math.sin(pp) * dist + sy, P.pos.z + Math.cos(ya) * Math.cos(pp) * dist);
    camE.lookAt(P.pos.x + sx * .5, ty + sy * .5, P.pos.z);
  }
  fxUpdate(dt); numsUpdate(dt); iconsUpdate();
  $('vState').textContent = P.state; $('vClip').textContent = `${curClip} ×${animSpeed.toFixed(2)}`;
  $('vCombo').textContent = P.state.startsWith('Attack') ? `${P.step + 1}段目 ${P.t.toFixed(2)}s ${P.buffered ? '（次へ）' : ''}` : (cd.triple > 0 ? `CT ${cd.triple.toFixed(1)}s` : '-');
  $('vInv').textContent = P.inv ? '無敵' : '-';
  decalsUpdate(dt); lockUpdate(); if (enemyHitLast) enemyHitLast.t -= dt;
  drawDebug();
});
app.on('postupdate', (dt) => secondary(hitstop > 0 ? 0 : Math.min(dt, 1 / 20)));
window.__dbg = { app, P, SK, G, U, cd, shapes, overlap, hurtboxes, worldEvents, runTests, findTarget, get yokai() { return yokai; }, set yokai(v) { yokai = v; }, get hp() { return hp; }, enemies, techset, trySlot, keys, pressed, released, hurtPlayer, clipLen };
</script>
</body>
</html>
