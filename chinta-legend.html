<style>
:root{--gold:#ffd34e;--ink:#fff;--panel:rgba(14,10,24,.78);--line:rgba(255,211,78,.55)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font:500 16px/1.5 "M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;z-index:20}
.ov.on{display:flex}
h1,.dela{font-family:"Dela Gothic One",sans-serif;font-weight:400}
button{font:inherit;cursor:pointer}
/* タイトル */
#title{background:linear-gradient(180deg,rgba(10,6,30,.15),rgba(10,6,30,.82) 70%);justify-content:flex-end;padding-bottom:max(22px,env(safe-area-inset-bottom))}
#title h1{font-size:clamp(40px,8vw,84px);line-height:1;margin:0;color:var(--gold);text-shadow:0 4px 0 #7a1010,0 0 30px rgba(255,120,40,.6)}
#title .sub{font-size:clamp(15px,2.4vw,20px);margin:8px 0 18px;letter-spacing:.2em}
.chs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(860px,100%)}
.ch{border:2px solid var(--line);background:var(--panel);color:#fff;border-radius:12px;padding:10px 8px;text-align:left;min-height:74px}
.ch b{display:block;color:var(--gold);font-size:13px}
.ch span{font-size:15px;font-weight:800}
.ch small{display:block;font-size:12px;opacity:.75}
.ch[disabled]{opacity:.45;cursor:default}
.ch:not([disabled]):hover,.ch:focus-visible{border-color:var(--gold);outline:none;transform:translateY(-2px)}
.back{margin-top:12px;color:#ddd;font-size:14px}
.back a{color:var(--gold)}
@media(max-width:600px){.chs{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:10}

#hp{position:absolute;left:16px;top:14px;display:flex;gap:3px;flex-wrap:wrap;max-width:260px}

#coins{position:absolute;left:18px;top:46px;font-weight:800;text-shadow:0 2px 0 #000}
#obj{position:absolute;left:16px;top:76px;background:var(--panel);border-left:4px solid var(--gold);padding:6px 12px;border-radius:0 8px 8px 0;font-size:15px;max-width:min(360px,60vw)}
#obj b{color:var(--gold);display:block;font-size:12px}
#mini{position:absolute;right:14px;top:14px;width:150px;height:150px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 4px 16px rgba(0,0,0,.5)}
#boss{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);width:min(560px,80vw);display:none}
#boss .nm{font-family:"Dela Gothic One";color:#c9ff7a;text-shadow:0 2px 0 #000;font-size:18px}
#boss .bar{height:14px;background:rgba(0,0,0,.6);border:2px solid #000;border-radius:7px;overflow:hidden}
#boss .fill{height:100%;width:100%;background:linear-gradient(90deg,#9cff3a,#b45be0);transition:width .15s}
#prompt{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:var(--panel);border:2px solid var(--gold);border-radius:20px;padding:4px 16px;display:none;font-weight:800}
#charge{position:absolute;left:50%;top:58%;transform:translateX(-50%);width:120px;height:8px;border-radius:4px;background:rgba(0,0,0,.5);display:none;overflow:hidden}

#hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;color:rgba(255,255,255,.85);text-shadow:0 1px 2px #000}
#flash{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(220,0,0,.55));opacity:0;transition:opacity .25s}
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;font-family:"Dela Gothic One";font-size:clamp(30px,6vw,60px);color:var(--gold);text-shadow:0 4px 0 #000,0 0 24px rgba(0,0,0,.6);opacity:0;transition:opacity .5s}

.panel{background:var(--panel);border:3px solid var(--gold);border-radius:18px;padding:24px 28px;max-width:560px}

#over{background:rgba(60,0,0,.55)}
#clear{background:radial-gradient(circle,rgba(40,20,0,.4),rgba(0,0,0,.85))}

#touch.on{display:block}
#joy{position:absolute;left:24px;bottom:34px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);pointer-events:auto}

#tJump{right:30px;bottom:132px;width:60px;height:60px}
#tRoll{right:112px;bottom:108px;width:54px;height:54px;font-size:13px}
#tTalk{right:110px;bottom:174px;width:54px;height:54px;font-size:13px;display:none}
</style>

<div id="view"></div>
<div id="load">よみこみ中…</div>

<div id="title" class="ov">
  <h1>朕太の伝説</h1>
  <div class="sub">〜 狂戦士の城 〜</div>

</div>

<div id="hud">

  <div id="obj"><b>目的</b><span id="objt"></span></div>

</div>

<div id="dlg"><b id="dlgn"></b><p id="dlgt"></p><i>▼</i></div>

<div id="over" class="ov"><div class="panel"><h2>朕太は倒れた…</h2><p>音叉石の進み具合はそのまま。もう一度立ち上がろう。</p><div class="btns"><button class="btn" id="retry">立ち上がる</button><button class="btn alt" id="toTitle1">タイトルへ</button></div></div></div>

<div id="clear" class="ov"><div class="panel"><h2>第1章 クリア！</h2><p id="clearStat"></p><p>今井は「バーサーカー様は玉座で待っている…」と言い残し、沼の底へ消えた。</p><p style="color:var(--gold);font-weight:800">次章『鏡の湖』 近日公開</p><div class="btns"><button class="btn" id="roam">このまま野を探索</button><button class="btn alt" id="toTitle2">タイトルへ</button></div></div></div>

<div id="touch">
  <div id="joy"><i></i></div>
  <button class="tb" id="tAtk" data-act="atk">攻撃</button>
  <button class="tb" id="tVoice" data-act="voice">声</button>
  <button class="tb" id="tJump" data-act="jump">跳</button>
  <button class="tb" id="tRoll" data-act="roll">回避</button>
  <button class="tb" id="tTalk" data-act="talk">話す</button>
</div>

<script type="module">
import * as THREE from 'three';

// 空のドームと雲
{
  const g = new THREE.SphereGeometry(700, 24, 12), col = [], p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const y = p.getY(i) / 700, c = mix([.72, .88, .97], [.25, .52, .9], clamp(y * 1.6, 0, 1)); col.push(...c); }

  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));
}
const clouds = new THREE.Group(); scene.add(clouds);
{
  const cm = new THREE.MeshLambertMaterial({ color: '#ffffff', emissive: '#c8dcec', flatShading: true, fog: false });
  for (let i = 0; i < 18; i++) {
    const c = new THREE.Group(), n = 3 + (rnd() * 3 | 0);
    for (let j = 0; j < n; j++) { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(R(8, 14), 0), cm); m.position.set(j * 10 - n * 5, R(-2, 3), R(-4, 4)); m.scale.y = .55; c.add(m); }
    c.position.set(R(-400, 400), R(110, 160), R(-450, 350)); clouds.add(c);
  }
}

/* =================== 地形 =================== */
const CEN = { x: 0, z: -40 }, VIL = { x: 0, z: 70 }, ARENA = { x: 0, z: -200 }, LAKE = { x: 72, z: -88 };
const STONES = [{ x: 150, z: 30, name: '東の丘' }, { x: -150, z: -10, name: '西の森' }, { x: 108, z: -122, name: '湖のほとり' }];
const PATHS = [[0, 62, 0, -152], [0, 22, 150, 30], [0, 2, -150, -10], [0, -58, 108, -122]];
function segD(px, pz, ax, az, bx, bz) { const dx = bx - ax, dz = bz - az, t = clamp(((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz), 0, 1); return Math.hypot(px - ax - dx * t, pz - az - dz * t); }

}

  if (x < -70) c = mix(c, [.22, .46, .2], sstep(-70, -110, x) * .7);

  const pd = pathD(x, z); if (pd < 4.2) c = mix(c, [.74, .62, .42], 1 - sstep(2.4, 4.2, pd));
  const dl = Math.hypot(x - LAKE.x, z - LAKE.z); if (dl < 44) c = mix(c, [.86, .79, .56], 1 - sstep(36, 44, dl));

  const r = Math.hypot(x - CEN.x, z - CEN.z); if (r > 236) c = mix(c, [.5, .47, .44], sstep(236, 262, r));

}
{
  const S = 660, SEG = 180, g = new THREE.PlaneGeometry(S, S, SEG, SEG); g.rotateX(-Math.PI / 2); g.translate(CEN.x, 0, CEN.z);

  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i), h = H(x, z); p.setY(i, h); const c = colorAt(x, z, h); col.set(c, i * 3); }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  const t = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 })); t.receiveShadow = true; scene.add(t);
}
const water = new THREE.Mesh(new THREE.CircleGeometry(44, 40), new THREE.MeshStandardMaterial({ color: '#3d8fd8', transparent: true, opacity: .82, roughness: .15, metalness: .2 }));
water.rotation.x = -Math.PI / 2; water.position.set(LAKE.x, -1.6, LAKE.z); scene.add(water);
const swamp = new THREE.Mesh(new THREE.CircleGeometry(40, 40), new THREE.MeshStandardMaterial({ color: '#3b2a4c', emissive: '#1e3a0c', roughness: .3 }));
swamp.rotation.x = -Math.PI / 2; swamp.position.set(ARENA.x, -0.25, ARENA.z); scene.add(swamp);

// ぶつかり判定（木・岩・家）：格子で管理
const GRID = new Map(), CS = 12, gk = (i, j) => i * 10007 + j;
function addCol(x, z, r) { const k = gk(Math.floor(x / CS), Math.floor(z / CS)); if (!GRID.has(k)) GRID.set(k, []); GRID.get(k).push({ x, z, r }); }

  const i = Math.floor(p.x / CS), j = Math.floor(p.z / CS);
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
    const L = GRID.get(gk(i + a, j + b)); if (!L) continue;

  && Math.hypot(x - LAKE.x, z - LAKE.z) > 42 + pad && pathD(x, z) > 6 + pad && STONES.every(s => Math.hypot(x - s.x, z - s.z) > 14 + pad);

/* ---- 木・岩・草 ---- */
const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), V1 = new THREE.Vector3(), V2 = new THREE.Vector3(), C1 = new THREE.Color();

{
  const trunks = [], pines = [], rounds = [];

  } else h.body.rotation.y = 0;
  if (p.charging) { const k = p.charge / 1.2; h.arms[0].rotation.set(-1.2 - k * .5, 0, -.3); h.arms[1].rotation.set(-.6, 0, .9); h.torso.rotation.x = -.15 - k * .2; h.body.position.x = Math.sin(time * 60) * .02 * k;
    if (Math.random() < .3 + k) burst(p.pos.x + Math.sin(p.face) * .6, p.pos.y + 1.5, p.pos.z + Math.cos(p.face) * .6, k > .95 ? '#ffffff' : '#7ff0ff', 1, 1.5, .5, .4, 0); }
  else h.body.position.x = 0;
  if (p.fireT > 0) { h.torso.rotation.x = .3; h.arms[0].rotation.set(-1.6, 0, -.2); h.arms[1].rotation.set(-1.6, 0, .2); }
  const blink = p.inv > 0 && Math.floor(time * 16) % 2 === 0; h.root.visible = !blink;
}

/* =================== カメラ =================== */
function updCamera(dt, instant) {
  const tx = PL.pos.x, ty = PL.pos.y + 1.7, tz = PL.pos.z;
  const cp = Math.cos(cam.pitch), want = V1.set(tx + Math.sin(cam.yaw) * cp * cam.dist, ty + Math.sin(cam.pitch) * cam.dist, tz + Math.cos(cam.yaw) * cp * cam.dist);
  const gy = H(want.x, want.z) + .9; if (want.y < gy) want.y = gy;
  if (instant) cam.pos.copy(want); else cam.pos.lerp(want, Math.min(1, dt * 10));
  camera.position.copy(cam.pos); camera.lookAt(tx, ty, tz);
}

/* =================== ミニマップ =================== */
const mini = $('mini').getContext('2d'), MAPW = 150, MAPS = 500;
const mapBase = document.createElement('canvas'); mapBase.width = mapBase.height = MAPW;
{
  const x = mapBase.getContext('2d'), img = x.createImageData(MAPW, MAPW);
  for (let j = 0; j < MAPW; j++) for (let i = 0; i < MAPW; i++) {
    const wx = CEN.x + (i / MAPW - .5) * MAPS, wz = CEN.z + (j / MAPW - .5) * MAPS, h = H(wx, wz);
    let c = colorAt(wx, wz, h); if (h < -1.6 && Math.hypot(wx - LAKE.x, wz - LAKE.z) < 44) c = [.24, .56, .85];
    const k = (j * MAPW + i) * 4; img.data[k] = c[0] * 255; img.data[k + 1] = c[1] * 255; img.data[k + 2] = c[2] * 255; img.data[k + 3] = 255;
  }
  x.putImageData(img, 0, 0);
}
const w2m = (x, z) => [(x - CEN.x) / MAPS * MAPW + MAPW / 2, (z - CEN.z) / MAPS * MAPW + MAPW / 2];
function drawMini() {
  const c = mini; c.save(); c.clearRect(0, 0, MAPW, MAPW); c.beginPath(); c.arc(75, 75, 75, 0, TAU); c.clip(); c.drawImage(mapBase, 0, 0);
  const dot = (x, z, col, r) => { const [a, b] = w2m(x, z); c.fillStyle = col; c.beginPath(); c.arc(a, b, r, 0, TAU); c.fill(); c.strokeStyle = '#000'; c.lineWidth = 1; c.stroke(); };
  { const [a, b] = w2m(ARENA.x, ARENA.z); c.strokeStyle = G.barrier ? '#c070ff' : '#9cff3a'; c.lineWidth = 2; c.beginPath(); c.arc(a, b, 50 / MAPS * MAPW, 0, TAU); c.stroke(); }
  for (const e of enemies) if (Math.hypot(e.pos.x - PL.pos.x, e.pos.z - PL.pos.z) < 60) dot(e.pos.x, e.pos.z, '#ff4a4a', 1.6);
  for (const s of stoneObjs) dot(s.x, s.z, s.lit ? '#ffd34e' : '#7ff0ff', 3.4);
  if (!G.talked) dot(elder.position.x, elder.position.z, '#ffffff', 3);
  if (boss && boss.st !== 'gone') dot(boss.pos.x, boss.pos.z, '#9cff3a', 3.4);
  const [px, pz] = w2m(PL.pos.x, PL.pos.z); c.translate(px, pz); c.rotate(-PL.face + Math.PI);
  c.fillStyle = '#ffd34e'; c.strokeStyle = '#000'; c.beginPath(); c.moveTo(0, -6); c.lineTo(4.5, 5); c.lineTo(-4.5, 5); c.closePath(); c.fill(); c.stroke();
  c.restore();
}

/* =================== ループ =================== */
const clock = new THREE.Clock(); let miniT = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05); time += dt;
  clouds.children.forEach((c, i) => { c.position.x += dt * (2 + i % 3); if (c.position.x > 450) c.position.x = -450; });
  water.material.color.setHSL(.58, .62, .55 + Math.sin(time) * .02);
  dome.material.opacity = G && !G.barrier ? Math.max(0, dome.material.opacity - dt * .25) : .2 + Math.sin(time * 2) * .05; dome.visible = dome.material.opacity > .01;
  if (Math.random() < .3) burst(ARENA.x + R(-30, 30), 0, ARENA.z + R(-30, 30), '#7a4a9a', 1, .3, 1.5, 1.2, 0);
  stoneObjs.forEach(s => { s.ring.rotation.z += dt * (s.lit ? 3 : .8); s.ring.position.y = 3.2 + Math.sin(time * 2 + s.x) * .25; if (s.lit) s.beam.material.opacity = lerp(s.beam.material.opacity, .35 + Math.sin(time * 3) * .08, dt * 2); });
  if (state === 'title' || state === 'loading') {
    const a = time * .15; camera.position.set(Math.sin(a) * 9, H(0, 75) + 2.6, 75 + Math.cos(a) * 9); camera.lookAt(.3, H(0, 75) + 1.6, 75);
    animHuman(tHero, dt, 0, time); animHuman(tBers, dt, 0, time);
    tHero.arms[0].rotation.set(-2.6, 0, -.3); tBers.arms[0].rotation.set(-.4, 0, -.6); tBers.arms[1].rotation.set(-.4, 0, .6);
    bersLight.intensity = 25 + Math.sin(time * 6) * 8;
    if (Math.random() < .6) burst(2.2 + R(-1, 1), H(2.2, 74) + R(0, 1), 74 + R(-1, 1), Math.random() < .5 ? '#ff2a2a' : '#ff8a2a', 1, .5, 2.5, 1, -1);
    sun.position.set(40, 70, 105); sun.target.position.set(0, 0, 75);
  } else if (G) {
    if (state === 'play') {
      updPlayer(dt); updEnemies(dt); updBoss(dt); updWaves(dt); updHazards(dt);
      const dE = Math.hypot(PL.pos.x - elder.position.x, PL.pos.z - elder.position.z), canTalk = dE < 3.6;
      $('prompt').style.display = canTalk ? 'block' : 'none'; $('tTalk').style.display = canTalk ? 'block' : 'none';
      elder.rotation.y += angDiff(elder.rotation.y, Math.atan2(PL.pos.x - elder.position.x, PL.pos.z - elder.position.z)) * Math.min(1, dt * 3) * (dE < 12 ? 1 : 0);
      if (canTalk && hit('KeyE', 'Enter', 'T_talk')) elderTalk();
    } else if (state === 'dialog') {
      if (hit('KeyE', 'Enter', 'Space', 'KeyJ', 'T_talk', 'T_atk')) nextLine();
      $('prompt').style.display = 'none';
    } else { updBoss(dt * (state === 'clear' ? 1 : 0)); }
    poseHero(dt); updCamera(dt);
    sun.position.set(PL.pos.x + 40, PL.pos.y + 70, PL.pos.z + 30); sun.target.position.copy(PL.pos);
    if ((miniT += dt) > .1) { miniT = 0; drawMini(); }
    if (flashT > 0) flashT -= dt; $('flash').style.opacity = flashT > 0 ? 1 : 0;
  }
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').style.opacity = 0; }
  updParts(dt);
  pressed.clear();
  scene.updateMatrixWorld();
  if (titleGroup.visible) { fixHead(tHero); fixHead(tBers); } else { fixHead(hero); if (boss && boss.st !== 'gone') fixHead(boss.h); }
  renderer.render(scene, camera);
}
function elderTalk() {
  if (!G.talked) {
    talk('長老', ['おお、朕太よ。よく来てくれた。', '狂戦士バーサーカーが皇城を奪い、国じゅうに手下を放ったのじゃ。', 'この野を荒らしておるのは、触手使いの今井。南の毒の沼に結界を張って居座っておる。', '結界を解くには、野に眠る三つの「音叉石」を鳴らすしかない。', 'おぬしの声なら届くはずじゃ。' + (touchUI ? '「声」ボタンを長押しして' : 'K キー（右クリック）を長押しして') + '、石に声を響かせるのじゃ！', '音叉石は東の丘・西の森・湖のほとりにある。地図の水色の印じゃ。'],
      () => { G.talked = true; G.stage = 1; setObjective(`音叉石を声で鳴らそう（${G.lit}/3）`); });
  } else if (G.barrier) talk('長老', [`音叉石はあと ${3 - G.lit} つじゃ。地図の水色の印を目指すのじゃ。`, 'ためた声ほど遠くまで、強く響くぞ。']);
  else if (!G.bossDone) talk('長老', ['結界が解けた！ 今井は南の沼の真ん中じゃ。', '触手が地面から出る前に、紫の輪から離れるのじゃぞ。横なぎは跳んでかわせ！']);
  else talk('長老', ['ようやった、朕太！ 野に平和が戻った。', 'じゃが玉座にはまだバーサーカーがおる…次は鏡の湖へ向かうのじゃ。']);
}

// 開始
window.__G = { get G() { return G; }, PL, get boss() { return boss; }, get enemies() { return enemies; }, get state() { return state; }, lightStone: i => lightStone(stoneObjs[i]), startChapter, H };
updCamera(0, true);
requestAnimationFrame(frame);
setTimeout(() => { $('load').style.display = 'none'; toTitle(); }, 300);
</script>
