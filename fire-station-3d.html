<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>消防署さんぽ</title>
<style>
  :root { --ink:#1f2433; --chip:rgba(255,255,255,.88); --red:#d7262e; }
  html, body { margin:0; height:100%; overflow:hidden; background:linear-gradient(#5e9be0 0%, #a9cdf2 55%, #e6f0f8 100%); }
  body { font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color:var(--ink); }
  body.night { background:linear-gradient(#060b1c 0%, #13203d 60%, #24314d 100%); }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #hud { position:fixed; left:16px; top:14px; display:flex; gap:10px; align-items:center; pointer-events:none; }
  #hud h1 { margin:0; font-size:18px; padding:6px 12px; background:var(--chip); border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  #hud a { pointer-events:auto; font-size:13px; text-decoration:none; color:var(--ink); padding:7px 10px; background:var(--chip); border-radius:10px; font-weight:700; }
  #bar { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:calc(100% - 32px); max-width:560px; }
  #bar button { font:inherit; font-size:14px; font-weight:700; border:0; border-radius:999px; padding:10px 16px; background:var(--chip); color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.18); cursor:pointer; }
  #bar button.on { background:var(--red); color:#fff; }
  #hint { position:fixed; right:16px; top:16px; font-size:12px; background:var(--chip); padding:6px 10px; border-radius:8px; transition:opacity .6s; }
  body.walk #bFront, body.walk #bSpin { display:none; }
  #joy, #jump { display:none; }
  #joy { position:fixed; left:22px; bottom:26px; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.28); border:2px solid rgba(255,255,255,.7); touch-action:none; }
  #knob { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%; background:rgba(255,255,255,.92); box-shadow:0 2px 8px rgba(0,0,0,.25); pointer-events:none; }
  #jump { position:fixed; right:24px; bottom:40px; width:92px; height:92px; border-radius:50%; border:0; font:inherit; font-weight:800; font-size:15px; background:rgba(255,255,255,.9); color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.25); touch-action:none; }
  @media (pointer:coarse) {
    body.walk #joy, body.walk #jump { display:block; }
    #bar { top:62px; bottom:auto; }
  }
  @media (max-width:600px) { #hint { display:none; } #hud h1 { font-size:16px; } }
</style>
<script type="importmap">{ "imports": { "playcanvas": "./lib/playcanvas.min.mjs" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><a href="index.html">◀ もどる</a><h1>消防署さんぽ</h1></div>
<div id="hint">ドラッグで回転・ホイール／ピンチで拡大</div>
<div id="joy"><div id="knob"></div></div>
<button id="jump">ジャンプ</button>
<div id="bar">
  <button id="bMode">ながめる</button>
  <button id="bFront">正面</button>
  <button id="bSpin">自動回転</button>
  <button id="bNight">夜にする</button>
  <button id="bSiren">赤色灯</button>
</div>

<script type="module">
import {
  Application, Entity, Color, Vec3, StandardMaterial, Texture,
  FILLMODE_FILL_WINDOW, RESOLUTION_AUTO, BLEND_NORMAL, PIXELFORMAT_SRGBA8,
  FILTER_LINEAR, FILTER_LINEAR_MIPMAP_LINEAR, ADDRESS_CLAMP_TO_EDGE,
  TONEMAP_ACES, GAMMA_SRGB, SHADOW_PCF3_32F,
  Mesh, MeshInstance, TorusGeometry, CULLFACE_FRONT
} from 'playcanvas';

// 看板の文字（必要ならここを書きかえる）
const SIGN_TEXT = '消防署東部出張所';

// ---------- アプリ ----------
const canvas = document.getElementById('c');
const app = new Application(canvas, { graphicsDeviceOptions: { antialias: true, alpha: true } });
app.graphicsDevice.maxPixelRatio = Math.min(window.devicePixelRatio || 1, 2);
app.setCanvasFillMode(FILLMODE_FILL_WINDOW);
app.setCanvasResolution(RESOLUTION_AUTO);
const onResize = () => app.resizeCanvas();
window.addEventListener('resize', onResize);
app.start();

const batch = app.batcher.addGroup('static', false, 200);
const world = new Entity('world');
app.root.addChild(world);

// ---------- 材質 ----------
function mat(hex, o = {}) {
  const m = new StandardMaterial();
  m.diffuse = new Color().fromString(hex);
  m.gloss = o.gloss ?? 0.2;
  m.specular = new Color(o.spec ?? 0.04, o.spec ?? 0.04, o.spec ?? 0.04);
  if (o.emissive) { m.emissive = new Color().fromString(o.emissive); m.emissiveIntensity = o.ei ?? 1; }
  if (o.opacity != null) { m.opacity = o.opacity; m.blendType = BLEND_NORMAL; m.depthWrite = false; }
  m.update();
  return m;
}
const M = {
  wall:     mat('#eeeeea'),
  wall2:    mat('#e3e3de'),
  parapet:  mat('#f3f3f0'),
  shade:    mat('#9a9b98'),
  frame:    mat('#c9ccce', { spec: 0.3, gloss: 0.5 }),
  glass:    mat('#3d4c5c', { spec: 0.5, gloss: 0.85 }),
  curtain:  mat('#eef1f3'),
  rust:     mat('#8a3a24', { gloss: 0.3 }),
  tower:    mat('#6a2617', { gloss: 0.3 }),
  pipe:     mat('#9ea3a7', { spec: 0.3, gloss: 0.5 }),
  asphalt:  mat('#727579'),
  apron:    mat('#8f9294'),
  concrete: mat('#b4b2ac'),
  dark:     mat('#2c2e30'),
  inner:    mat('#d8ccb0'),
  innerDk:  mat('#4b4a47'),
  beam:     mat('#7a5a3c'),
  wood:     mat('#c09a68'),
  green:    mat('#3aa05a', { opacity: 0.85 }),
  yellow:   mat('#e8d33a'),
  lime:     mat('#a7d44a'),
  white:    mat('#f7f7f5'),
  red:      mat('#d21f26', { spec: 0.35, gloss: 0.7 }),
  redDk:    mat('#9f161b', { spec: 0.2, gloss: 0.5 }),
  carWhite: mat('#f4f5f6', { spec: 0.35, gloss: 0.7 }),
  chrome:   mat('#d0d3d6', { spec: 0.6, gloss: 0.8 }),
  tire:     mat('#1d1d1e'),
  beacon:   mat('#ff2a2a', { emissive: '#ff2a2a', ei: 0.15 }),
  lamp:     mat('#fff6d8', { emissive: '#fff2c4', ei: 0.2 }),
  blue:     mat('#3a7cc9'),
  navy:     mat('#20283a', { spec: 0.4, gloss: 0.8 }),
  neighbor: mat('#aeaca7'),
  apt:      mat('#bea88c'),
  aptDk:    mat('#8f7c66'),
  grass:    mat('#5d8a45'),
};

// ---------- 形を置く道具 ----------
// box: x0..x1, y0..y1, z0..z1 の範囲を埋める箱
// 当たり判定：足もとの高さにある箱は通れない（低い箱には乗れる）。大きな箱にはカメラもめりこまない
const colliders = [], occluders = [];
function addCollider(x0, x1, z0, z1, y0 = 0, y1 = 3) {
  colliders.push({ x0: Math.min(x0, x1), x1: Math.max(x0, x1), z0: Math.min(z0, z1), z1: Math.max(z0, z1), y0, y1 });
}
function box(m, x0, x1, y0, y1, z0, z1, parent = world, dyn = false) {
  if (parent === world) {
    const b = { x0: Math.min(x0, x1), x1: Math.max(x0, x1), y0: Math.min(y0, y1), y1: Math.max(y0, y1), z0: Math.min(z0, z1), z1: Math.max(z0, z1) };
    if (b.y1 > 0 && b.y0 < 1.2) colliders.push(b);
    if (b.x1 - b.x0 >= 0.5 && b.z1 - b.z0 >= 0.5 && b.y1 - b.y0 >= 1) occluders.push(b);
  }
  const e = new Entity();
  e.addComponent('render', { type: 'box', material: m, batchGroupId: dyn ? -1 : batch.id });
  e.setLocalPosition((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  e.setLocalScale(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0));
  parent.addChild(e);
  return e;
}
// 円柱（axis: 'x' | 'y' | 'z'）
function cyl(m, x, y, z, r, len, axis = 'y', parent = world, type = 'cylinder') {
  const e = new Entity();
  e.addComponent('render', { type, material: m, batchGroupId: batch.id });
  e.setLocalPosition(x, y, z);
  e.setLocalScale(r * 2, len, r * 2);
  if (axis === 'x') e.setLocalEulerAngles(0, 0, 90);
  if (axis === 'z') e.setLocalEulerAngles(90, 0, 0);
  parent.addChild(e);
  return e;
}
// 細い棒（2点間）
function bar(m, a, b, t = 0.08, parent = world) {
  const e = new Entity();
  e.addComponent('render', { type: 'box', material: m, batchGroupId: batch.id });
  const mid = new Vec3().add2(a, b).mulScalar(0.5);
  const len = a.distance(b);
  e.setLocalPosition(mid);
  e.setLocalScale(t, len, t);
  parent.addChild(e);
  e.lookAt(b);           // -Z を b に向ける
  e.rotateLocal(-90, 0, 0); // 箱の長辺 (Y) を b の方向へ
  return e;
}
const V = (x, y, z) => new Vec3(x, y, z);

// 窓：外枠・ガラス・カーテン
const nightGlass = [];
function windowSet(x0, x1, y0, y1, units, z = 0, curtain = true) {
  const f = 0.09, d = 0.12;
  box(M.frame, x0 - f, x1 + f, y0 - f, y0, z, z + d);
  box(M.frame, x0 - f, x1 + f, y1, y1 + f, z, z + d);
  box(M.frame, x0 - f, x0, y0, y1, z, z + d);
  box(M.frame, x1, x1 + f, y0, y1, z, z + d);
  const w = (x1 - x0) / units;
  for (let i = 0; i < units; i++) {
    const a = x0 + i * w, b = a + w;
    if (i > 0) box(M.frame, a - 0.04, a + 0.04, y0, y1, z, z + d);
    box(M.glass, a, b, y0, y1, z, z + 0.03);
    if (curtain) {
      // カーテンは窓ごとに少しずつ開き具合を変える
      const open = [0.15, 0.55, 0.3, 0.7, 0.4, 0.2][i % 6];
      const g = box(M.curtain, a + 0.05, b - 0.05 - (b - a) * open * 0.5, y0 + 0.05, y1 - 0.05, z + 0.03, z + 0.045);
      nightGlass.push(g);
    }
    box(M.frame, (a + b) / 2 - 0.025, (a + b) / 2 + 0.025, y0, y1, z, z + 0.06);
  }
}
// 手すり：前面に沿った柵
function railing(m, x0, x1, y, h, z, ret = 1.5, t = 0.07) {
  const posts = Math.max(2, Math.round((x1 - x0) / 1.3) + 1);
  for (let i = 0; i < posts; i++) {
    const x = x0 + (x1 - x0) * i / (posts - 1);
    box(m, x - t / 2, x + t / 2, y, y + h, z - t / 2, z + t / 2);
  }
  box(m, x0, x1, y + h - t, y + h, z - t / 2, z + t / 2);
  box(m, x0, x1, y + h * 0.5 - t / 2, y + h * 0.5 + t / 2, z - t / 2, z + t / 2);
  for (const x of [x0, x1]) {
    box(m, x - t / 2, x + t / 2, y + h - t, y + h, z - ret, z);
    box(m, x - t / 2, x + t / 2, y, y + h, z - ret, z - ret + t);
  }
}

// ---------- 地面 ----------
box(M.asphalt, -200, 220, -0.2, 0, -200, 200);
box(M.apron, -0.5, 27.2, 0, 0.03, 0, 11);
box(M.concrete, -200, 220, 0, 0.15, 13, 15.5);      // 歩道
box(M.shade, -200, 220, 0, 0.17, 12.85, 13.05);     // 縁石
for (const [x, z] of [[3.2, 6.8], [12.4, 6.6], [22.5, 9.5]]) cyl(M.innerDk, x, 0.03, z, 0.35, 0.04);
// 白線（駐車スペースの目印）
for (const x of [14.9, 22.2]) box(M.white, x - 0.06, x + 0.06, 0.03, 0.04, 0.3, 8);

// ---------- 右の本館（2階建て） ----------
const XM0 = 11.2, XM1 = 26.7, DEP = 10;
// 1階：左の事務室部分
box(M.wall, XM0, 14.3, 0, 4.1, -DEP, 0);
// 柱と壁
box(M.wall, 14.3, 15.3, 0, 4.1, -DEP, 0);
box(M.wall, 21.8, 23.5, 0, 4.1, -DEP, 0);
box(M.wall, 25.6, XM1, 0, 4.1, -DEP, 0);
// 車庫の中
box(M.concrete, 15.3, 21.8, 0, 0.04, -DEP, 0);
box(M.inner, 15.3, 21.8, 0, 4.1, -DEP, -DEP + 0.2);
box(M.innerDk, 15.3, 21.8, 3.8, 4.1, -DEP, -0.25);                  // 天井
box(M.wall2, 15.3, 21.8, 3.75, 4.1, -0.3, 0);                       // 開口の上の梁
for (const x of [16.9, 19.9]) box(M.lamp, x - 0.6, x + 0.6, 3.72, 3.78, -5.2, -4.9);
// 右の小さな車庫（奥行きが浅い）
box(M.innerDk, 23.5, 25.6, 0, 4.1, -DEP, -3);
box(M.concrete, 23.5, 25.6, 0, 0.04, -3, 0);
box(M.innerDk, 23.5, 25.6, 3.8, 4.1, -3, 0);
box(M.white, 24.0, 25.0, 0.04, 2.1, -3, -2.95);                     // 奥のドア
// 2階
box(M.wall, XM0, XM1, 4.1, 8.0, -DEP, 0);
// ひさし（1階と2階の間）
box(M.wall2, XM0 - 0.1, XM1 + 0.3, 4.1, 4.7, -0.2, 0.9);
box(M.shade, XM0 - 0.1, XM1 + 0.3, 4.08, 4.12, 0, 0.9);
// 屋上の立ち上がり
box(M.parapet, XM0 - 0.05, XM1 + 0.05, 8.0, 8.8, -DEP - 0.05, 0.12);
box(M.concrete, XM0 + 0.25, XM1 - 0.25, 8.6, 8.82, -DEP + 0.25, -0.15);
// 2階の窓
windowSet(12.2, 13.8, 5.6, 7.2, 2);
windowSet(14.9, 22.0, 5.6, 7.2, 5);
windowSet(23.0, 24.7, 5.6, 7.2, 2);
// 屋上のさび色の手すり
railing(M.rust, 11.6, 17.1, 8.8, 1.1, -0.4);
railing(M.rust, 19.6, 25.2, 8.8, 1.1, -0.4);
// アンテナ
box(M.pipe, 16.35, 16.42, 8.8, 10.6, -3.04, -2.96);
box(M.pipe, 15.9, 16.9, 10.2, 10.25, -3.03, -2.97);
box(M.pipe, 16.1, 16.65, 10.45, 10.5, -3.03, -2.97);

// 1階の入口まわり
box(M.frame, 12.55, 14.1, 0.03, 2.9, 0, 0.1);
box(M.glass, 12.65, 14.0, 0.08, 2.8, 0.05, 0.12);
box(M.frame, 13.3, 13.36, 0.08, 2.8, 0.05, 0.14);
box(M.white, 12.75, 13.25, 0.9, 2.2, 0.1, 0.15);                    // 掲示物
box(M.white, 13.45, 13.9, 1.2, 2.3, 0.1, 0.15);
box(M.white, 11.95, 12.2, 1.4, 2.5, 0, 0.08);                       // たて看板
const entryLamp = box(M.lamp, 13.1, 13.5, 3.2, 3.35, 0, 0.15);
// 柱のホース
cyl(M.blue, 14.8, 0.6, 0.12, 0.35, 0.12, 'z', world, 'torus');
cyl(M.white, 14.8, 0.6, 0.12, 0.2, 0.1, 'z');
// 右端の室外機
box(M.white, 26.1, 26.65, 0, 0.6, 0.0, 0.5);
box(M.shade, 26.15, 26.6, 0.1, 0.5, 0.5, 0.52);

// ---------- 左の車庫棟 ----------
const XA1 = XM0, DA = 7.5;
box(M.wall, 0, 0.55, 0, 5.0, -DA, 0.15);                            // 左の柱
box(M.wall, 10.1, XA1, 0, 5.0, -DA, 0.15);                          // 右の柱
box(M.wall, 0, XA1, 5.0, 7.0, -0.5, 0.15);                          // 看板の帯
box(M.wall2, 0, XA1, 5.0, 5.6, -DA, -0.5);                          // 屋根
box(M.wall, -0.05, XA1, 6.95, 7.05, -0.6, 0.2);
box(M.shade, 0.55, 10.1, 4.95, 5.0, -0.5, 0.15);
// 中
box(M.concrete, 0.55, 10.1, 0, 0.04, -DA, 0);
box(M.inner, 0.55, 10.1, 0, 5.0, -DA, -DA + 0.2);
box(M.inner, 0.55, 0.7, 0, 5.0, -DA, 0);
box(M.inner, 9.95, 10.1, 0, 5.0, -DA, 0);
box(M.innerDk, 0.55, 10.1, 4.8, 5.0, -DA, -0.5);
for (let x = 1.2; x < 10; x += 1.5) box(M.beam, x - 0.08, x + 0.08, 4.5, 4.8, -DA, -0.5);
box(M.beam, 0.55, 10.1, 3.4, 3.55, -2.6, -2.45);
// 木の棚
for (const x of [3.0, 4.8, 6.6]) box(M.wood, x - 0.07, x + 0.07, 0, 3.4, -2.6, -2.45);
for (const y of [1.2, 2.3]) box(M.wood, 3.0, 6.6, y, y + 0.08, -2.6, -2.45);
// 奥の棚と荷物
for (let x = 1.2; x < 9.5; x += 2.1) {
  box(M.pipe, x, x + 1.8, 0, 2.6, -DA + 0.2, -DA + 0.8);
  box(M.wood, x + 0.15, x + 0.8, 0.3, 0.9, -DA + 0.5, -DA + 0.9);
  box(M.white, x + 0.9, x + 1.6, 1.6, 2.2, -DA + 0.4, -DA + 0.9);
}
// 白いロッカー
box(M.white, 7.2, 8.1, 0, 2.0, -3.6, -2.8);
box(M.shade, 7.62, 7.68, 0.2, 1.8, -2.8, -2.78);
// 掛けてある防火服
for (const [x, m] of [[1.6, M.yellow], [2.15, M.lime], [2.7, M.yellow], [3.25, M.green]]) box(m, x - 0.22, x + 0.22, 1.5, 2.5, -1.6, -1.45);
box(M.pipe, 1.2, 3.6, 2.5, 2.55, -1.55, -1.5);
// のぼり
box(M.white, 0.9, 1.3, 0.2, 2.6, -0.8, -0.75);
box(M.pipe, 0.86, 0.9, 0, 2.7, -0.8, -0.75);
// 自転車
function bike(x, z, m) {
  for (const dx of [-0.55, 0.55]) {
    const w = cyl(M.tire, x + dx, 0.36, z, 0.33, 0.3, 'z', world, 'torus');
    w.setLocalScale(0.7, 0.1, 0.7);
  }
  bar(m, V(x - 0.55, 0.36, z), V(x - 0.05, 0.8, z), 0.05);
  bar(m, V(x - 0.05, 0.8, z), V(x + 0.45, 0.85, z), 0.05);
  bar(m, V(x + 0.55, 0.36, z), V(x + 0.45, 0.95, z), 0.05);
  bar(m, V(x - 0.55, 0.36, z), V(x + 0.05, 0.36, z), 0.04);
  bar(m, V(x + 0.05, 0.36, z), V(x - 0.05, 0.8, z), 0.04);
  box(M.dark, x - 0.2, x + 0.05, 0.85, 0.92, z - 0.08, z + 0.08);
  box(M.dark, x + 0.4, x + 0.48, 0.95, 1.0, z - 0.3, z + 0.3);
}
bike(2.6, -1.2, M.red);
bike(4.2, -1.6, M.pipe);
bike(5.4, -1.0, M.blue);
// 緑のカーテン
const curtainEnt = box(M.green, 8.75, 10.05, 0.3, 4.9, -0.45, -0.35);
curtainEnt.setLocalEulerAngles(0, 0, -3);
box(M.pipe, 8.6, 10.1, 4.85, 4.9, -0.45, -0.35);
// 看板の上の小さなマーク
cyl(M.navy, 5.6, 6.62, 0.16, 0.1, 0.02, 'z');

// 看板の文字（キャンバスで描いて板に貼る）
{
  const c = document.createElement('canvas');
  c.width = 2048; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#eeeeea'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#2d3550';
  g.font = 'bold 150px "Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","WenQuanYi Zen Hei",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const chars = [...SIGN_TEXT];
  const step = Math.min(220, 1800 / chars.length);
  chars.forEach((ch, i) => g.fillText(ch, c.width / 2 + (i - (chars.length - 1) / 2) * step, c.height / 2 + 8));
  const tex = new Texture(app.graphicsDevice, {
    width: c.width, height: c.height, format: PIXELFORMAT_SRGBA8, mipmaps: true,
    minFilter: FILTER_LINEAR_MIPMAP_LINEAR, magFilter: FILTER_LINEAR,
    addressU: ADDRESS_CLAMP_TO_EDGE, addressV: ADDRESS_CLAMP_TO_EDGE
  });
  tex.setSource(c);
  const sm = new StandardMaterial();
  sm.diffuseMap = tex; sm.update();

const meshCache = {};
function torusMesh(ring, tube) {
  const key = ring + '_' + tube;
  return meshCache[key] ??= Mesh.fromGeometry(app.graphicsDevice,
    new TorusGeometry({ ringRadius: ring, tubeRadius: tube, segments: 24, sides: 8 }));
}
function piece(parent, kind, m, pos, scale, rot) {
  const e = new Entity();
  if (typeof kind === 'string') e.addComponent('render', { type: kind, material: m });
  else e.addComponent('render', { meshInstances: [new MeshInstance(kind, m)] });
  e.setLocalPosition(...pos);
  if (scale) e.setLocalScale(...scale);
  if (rot) e.setLocalEulerAngles(...rot);
  parent.addChild(e);
  return e;
}
function inked(parent, kind, m, pos, scale, rot, w = 0.03) {
  const e = piece(parent, kind, m, pos, scale, rot);
  const o = piece(parent, kind, outline, pos, scale.map(v => v + w * 2), rot);
  o.render.castShadows = false;
  return e;
}
// 棒の手足：ピボット（関節）から下へのびる
function limb(parent, pos, len, r = 0.03) {
  const pivot = new Entity();
  pivot.setLocalPosition(...pos);
  parent.addChild(pivot);
  piece(pivot, 'cylinder', CM.ink, [0, -len / 2, 0], [r * 2, len, r * 2]);
  return pivot;
}

const pointers = new Map();
let pinch0 = 0, dist0 = 0, mid0 = null, target0 = null;
const stopSpin = () => { if (state.spin) { state.spin = false; document.getElementById('bSpin').classList.remove('on'); } };
const hint = document.getElementById('hint');
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, button: e.button });
  stopSpin();
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = goal.dist;
    mid0 = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; target0 = goal.target.clone();
  }
});
function panBy(dx, dy, from) {
  if (state.mode === 'walk') return;
  const s = goal.dist * 0.0015;
  const right = camera.right.clone(), up = camera.up.clone();
  goal.target.copy(from).add(right.mulScalar(-dx * s)).add(up.mulScalar(dy * s));
  goal.target.y = Math.max(0.5, Math.min(14, goal.target.y));
}
const maxDist = () => state.mode === 'walk' ? 20 : 90;
const minDist = () => state.mode === 'walk' ? 2.5 : 8;
canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    if (p.button === 2 || e.shiftKey) panBy(dx, dy, goal.target.clone());
    else { goal.yaw -= dx * 0.3; goal.pitch = Math.max(-5, Math.min(80, goal.pitch + dy * 0.25)); }
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    goal.dist = Math.max(minDist(), Math.min(maxDist(), dist0 * pinch0 / Math.max(d, 1)));
    panBy((a.x + b.x) / 2 - mid0.x, (a.y + b.y) / 2 - mid0.y, target0);
  }
});
const endPointer = (e) => { pointers.delete(e.pointerId); if (pointers.size === 1) { const p = [...pointers.values()][0]; p.button = 0; } };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  goal.dist = Math.max(minDist(), Math.min(maxDist(), goal.dist * Math.exp(e.deltaY * 0.001)));
}, { passive: false });

// ---------- キーボードとスティック ----------
const keys = new Set();
window.addEventListener('keydown', (e) => {
  keys.add(e.code);
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space') jump();
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

const joy = { x: 0, y: 0, id: null };
const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
joyEl.addEventListener('pointerdown', (e) => { joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); moveJoy(e); });
joyEl.addEventListener('pointermove', (e) => { if (e.pointerId === joy.id) moveJoy(e); });
const endJoy = (e) => { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; };
joyEl.addEventListener('pointerup', endJoy);
joyEl.addEventListener('pointercancel', endJoy);
function moveJoy(e) {
  const r = joyEl.getBoundingClientRect();
  const R = r.width / 2;
  let dx = (e.clientX - r.left - R) / R, dy = (e.clientY - r.top - R) / R;
  const l = Math.hypot(dx, dy);
  if (l > 1) { dx /= l; dy /= l; }
  joy.x = dx; joy.y = -dy;
  knob.style.transform = `translate(${dx * R * 0.6}px, ${dy * R * 0.6}px)`;
}
document.getElementById('jump').addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });

function jump() {
  if (state.mode === 'walk' && player.grounded) { player.vy = 6.5; player.grounded = false; }
}

// ---------- ボタン ----------
function applyMode() {
  const walk = state.mode === 'walk';
  document.body.classList.toggle('walk', walk);
  document.getElementById('bMode').textContent = walk ? 'ながめる' : '歩く';
  hint.textContent = walk
    ? 'WASD／矢印で移動・Shiftで走る・スペースでジャンプ・ドラッグで視点'
    : 'ドラッグで回転・ホイール／ピンチで拡大';
  if (walk) { stopSpin(); behindHero(); } else frontView();
}
document.getElementById('bMode').onclick = () => { state.mode = state.mode === 'walk' ? 'view' : 'walk'; applyMode(); };
document.getElementById('bFront').onclick = () => { stopSpin(); frontView(); };
document.getElementById('bSpin').onclick = (e) => { state.spin = !state.spin; e.currentTarget.classList.toggle('on', state.spin); };
document.getElementById('bNight').onclick = () => { state.night = !state.night; applyTime(); };
document.getElementById('bSiren').onclick = (e) => { state.siren = !state.siren; e.currentTarget.classList.toggle('on', state.siren); };
state.mode = 'walk';
applyMode();
cam.yaw = goal.yaw; cam.dist = goal.dist; camDist = goal.dist;

// ---------- 当たり判定 ----------
const R = 0.32, HEIGHT = 1.7, STEP = 0.35;
function resolve(p) {
  for (let it = 0; it < 3; it++) {
    for (const b of colliders) {
      if (b.y1 <= p.y + STEP || b.y0 >= p.y + HEIGHT) continue;
      const cx = Math.max(b.x0, Math.min(p.x, b.x1));
      const cz = Math.max(b.z0, Math.min(p.z, b.z1));
      let dx = p.x - cx, dz = p.z - cz;
      const d = Math.hypot(dx, dz);
      if (d >= R) continue;
      if (d > 1e-5) { p.x += dx / d * (R - d); p.z += dz / d * (R - d); }
      else {
        const pen = [p.x - b.x0, b.x1 - p.x, p.z - b.z0, b.z1 - p.z];
        const m = Math.min(...pen), k = pen.indexOf(m);
        if (k === 0) p.x = b.x0 - R; else if (k === 1) p.x = b.x1 + R;
        else if (k === 2) p.z = b.z0 - R; else p.z = b.z1 + R;
      }
    }
  }
  p.x = Math.max(-60, Math.min(80, p.x));
  p.z = Math.max(-60, Math.min(60, p.z));
}
function groundAt(p) {
  let g = 0;
  for (const b of colliders) {
    if (b.y1 > p.y + STEP || b.y1 <= g) continue;
    if (p.x + R * 0.5 < b.x0 || p.x - R * 0.5 > b.x1 || p.z + R * 0.5 < b.z0 || p.z - R * 0.5 > b.z1) continue;
    g = b.y1;
  }
  return g;
}
// カメラが建物にめりこまないよう、主人公から外へ少しずつ進めて止める
function clearDistance(from, dir, want) {
  const pt = new Vec3();
  for (let d = 0.6; d <= want; d += 0.25) {
    pt.copy(dir).mulScalar(d).add(from);
    for (const b of occluders) {
      if (pt.x > b.x0 - 0.2 && pt.x < b.x1 + 0.2 && pt.y > b.y0 - 0.2 && pt.y < b.y1 + 0.2 && pt.z > b.z0 - 0.2 && pt.z < b.z1 + 0.2) {
        return Math.max(1.2, d - 0.3);
      }
    }
  }
  return want;
}

// ---------- 毎フレーム ----------
let t = 0;
const angleTo = (a, b) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
app.on('update', (dt) => {
  t += dt;
  const walkMode = state.mode === 'walk';

  // 主人公を動かす
  let ix = 0, iy = 0;
  if (walkMode) {
    if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
    if (keys.has('KeyW') || keys.has('ArrowUp')) iy += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) iy -= 1;
    ix += joy.x; iy += joy.y;
  }
  const yr0 = cam.yaw * Math.PI / 180;
  let mx = -Math.sin(yr0) * iy + Math.cos(yr0) * ix;
  let mz = -Math.cos(yr0) * iy - Math.sin(yr0) * ix;
  const ml = Math.hypot(mx, mz);
  if (ml > 1) { mx /= ml; mz /= ml; }
  const run = keys.has('ShiftLeft') || keys.has('ShiftRight') || Math.hypot(joy.x, joy.y) > 0.92;
  const speed = run ? 7 : 3.8;
  const moving = ml > 0.05;
  if (moving) {
    player.pos.x += mx * speed * dt;
    player.pos.z += mz * speed * dt;
    const want = Math.atan2(mx, mz);
    player.face += angleTo(player.face, want) * Math.min(1, dt * 12);
  }
  resolve(player.pos);
  // ジャンプと着地
  const g = groundAt(player.pos);
  player.vy -= 20 * dt;
  player.pos.y += player.vy * dt;
  if (player.pos.y <= g) { player.pos.y = g; player.vy = 0; player.grounded = true; }
  else if (player.pos.y > g + 0.05) player.grounded = false;
  hero.setLocalPosition(player.pos);
  hero.setLocalEulerAngles(0, player.face * 180 / Math.PI, 0);

  // 歩きのアニメーション
  const amt = moving ? Math.min(1, ml) : 0;
  player.walk += (amt - player.walk) * Math.min(1, dt * 10);
  player.phase += dt * (run ? 13 : 9) * (moving ? 1 : 0);
  const sw = Math.sin(player.phase) * player.walk;
  if (player.grounded) {
    legs[0].setLocalEulerAngles(sw * 38, 0, 0);
    legs[1].setLocalEulerAngles(-sw * 38, 0, 0);
    arms[0].setLocalEulerAngles(-sw * 34, 0, -28 - player.walk * 4);
    arms[1].setLocalEulerAngles(sw * 34, 0, 28 + player.walk * 4);
    heroBody.setLocalPosition(0, Math.abs(Math.sin(player.phase)) * 0.06 * player.walk + Math.sin(t * 2.4) * 0.008, 0);
  } else {
    legs[0].setLocalEulerAngles(25, 0, -8);
    legs[1].setLocalEulerAngles(-15, 0, 8);
    arms[0].setLocalEulerAngles(0, 0, -130);
    arms[1].setLocalEulerAngles(0, 0, 130);
    heroBody.setLocalPosition(0, 0, 0);
  }

  // カメラ
  if (walkMode) {
    goal.target.set(player.pos.x, player.pos.y + 1.35, player.pos.z);
  }
  if (state.spin) goal.yaw += dt * 8;
  const k = 1 - Math.exp(-dt * 10);
  cam.yaw += (goal.yaw - cam.yaw) * k;
  cam.pitch += (goal.pitch - cam.pitch) * k;
  cam.dist += (goal.dist - cam.dist) * k;
  cam.target.lerp(cam.target, goal.target, walkMode ? 1 - Math.exp(-dt * 14) : k);
  const yr = cam.yaw * Math.PI / 180, pr = cam.pitch * Math.PI / 180;
  const dir = new Vec3(Math.cos(pr) * Math.sin(yr), Math.sin(pr), Math.cos(pr) * Math.cos(yr));
  const want = walkMode ? clearDistance(cam.target, dir, cam.dist) : cam.dist;
  camDist = want < camDist ? want : camDist + (want - camDist) * Math.min(1, dt * 4);
  const cp = dir.clone().mulScalar(camDist).add(cam.target);
  cp.y = Math.max(0.3, cp.y);
  camera.setPosition(cp);
  camera.lookAt(cam.target);

  // 赤色灯：左右交互に点滅
  const on = state.siren;
  beaconMats.forEach((m, i) => {
    const phase = (Math.sin(t * 14 + i * Math.PI) + 1) / 2;
    m.emissiveIntensity = on ? 0.3 + phase * 3.5 : 0.15;
    m.update();
    sirenLights[i].light.intensity = on ? phase * 4 : 0;
  });
});

window.addEventListener('pagehide', () => {
  window.removeEventListener('resize', onResize);
  app.destroy();
});
</script>
</body>
</html>
